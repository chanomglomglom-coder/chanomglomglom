<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>สั่งซื้อเครื่องดื่ม - ชานมกลมกล่อม</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #f7f3ee;
      color: #3d2b1f; 
      -webkit-tap-highlight-color: transparent; 
    }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(61, 43, 31, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="selection:bg-amber-700 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDCwQ4AIxY5haYIj-Kd-nGNAq_Jn1t_aLk",
      authDomain: "chanomstock.firebaseapp.com",
      projectId: "chanomstock",
      storageBucket: "chanomstock.firebasestorage.app",
      messagingSenderId: "309865099169",
      appId: "1:309865099169:web:d5df7c674180ab845865e0",
      measurementId: "G-Y6HGEXEQWY"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=150';

    function CustomerOrderApp() {
      const [recipes, setRecipes] = useState([]);
      const [cart, setCart] = useState({});
      const [note, setNote] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [loading, setLoading] = useState(true);
      const [orderSuccess, setOrderSuccess] = useState(false);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // ดึงเมนูเครื่องดื่มจากฐานข้อมูลหลังร้านอัตโนมัติ
      useEffect(() => {
        const unsub = db.collection('recipes').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRecipes(data);
          setLoading(false);
        });
        return () => unsub();
      }, []);

      const handleQtyChange = (recipeId, delta) => {
        setCart(prev => {
          const current = prev[recipeId] || 0;
          const updated = Math.max(0, current + delta);
          return { ...prev, [recipeId]: updated };
        });
      };

      const selectedList = useMemo(() => {
        return Object.entries(cart)
          .filter(([_, qty]) => qty > 0)
          .map(([recipeId, qty]) => {
            const recipe = recipes.find(r => r.id === recipeId);
            const unitPrice = recipe ? (recipe.price || 35) : 35;
            return {
              recipeId,
              menuName: recipe ? recipe.name : 'เครื่องดื่ม',
              qty,
              price: unitPrice,
              totalPrice: unitPrice * qty,
              recipe
            };
          });
      }, [cart, recipes]);

      const grandTotal = useMemo(() => {
        return selectedList.reduce((acc, curr) => acc + curr.totalPrice, 0);
      }, [selectedList]);

      // ส่งออเดอร์เข้า Firebase ให้หลังร้านเห็น Real-time
      const handleSubmitOrder = async () => {
        if (selectedList.length === 0) return alert('กรุณาเลือกเครื่องดื่มอย่างน้อย 1 รายการ');

        try {
          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const yearTH = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${yearTH} ${hours}:${mins} น.`;

          await db.collection('orders').add({
            items: selectedList,
            totalPrice: grandTotal,
            note: note || '',
            datetime: timeStr,
            status: 'pending', // สถานะรอรับออเดอร์
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

          setOrderSuccess(true);
          setCart({});
          setNote('');
        } catch (err) {
          console.error("Error submitting order:", err);
          alert("เกิดข้อผิดพลาดในการส่งออเดอร์ กรุณาลองใหม่อีกครั้ง");
        }
      };

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }, [recipes, searchQuery]);

      if (orderSuccess) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#f7f3ee]">
            <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center custom-shadow border border-amber-100">
              <div className="w-16 h-16 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle" className="w-10 h-10"></i>
              </div>
              <h2 className="text-xl font-bold text-amber-950 mb-2">ส่งออเดอร์เรียบร้อยแล้ว!</h2>
              <p className="text-xs text-stone-500 mb-6">กรุณาแจ้งชื่อหรือชำระเงินที่เคาน์เตอร์หน้าร้าน ขอบคุณครับ/ค่ะ 🧋</p>
              <button
                onClick={() => setOrderSuccess(false)}
                className="w-full py-3 bg-amber-800 text-white font-bold text-sm rounded-2xl shadow-md hover:bg-amber-900 transition"
              >
                สั่งรายการเพิ่ม
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-32 flex flex-col justify-between">
          <div>
            {/* Header */}
            <header className="bg-white border-b border-amber-200/60 sticky top-0 z-40 shadow-sm p-4">
              <div className="max-w-md mx-auto flex items-center space-x-3">
                <div className="bg-amber-800 text-white p-2.5 rounded-2xl shadow-md">
                  <i data-lucide="cup-soda" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-bold text-amber-950 text-base">ชานมกลมกล่อม</h1>
                  <p className="text-[11px] text-stone-400 font-medium">สแกนสั่งเครื่องดื่มหน้าร้าน</p>
                </div>
              </div>
            </header>

            {/* Content */}
            <main className="max-w-md mx-auto p-4 space-y-4">
              <div className="relative">
                <input
                  type="text"
                  placeholder="ค้นหาเมนูเครื่องดื่ม..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl bg-white border border-stone-200 focus:outline-none focus:border-amber-700 pl-10 custom-shadow"
                />
                <span className="absolute left-3.5 top-3 text-stone-400 text-xs">🔍</span>
              </div>

              {loading ? (
                <div className="text-center py-12 text-stone-400 text-xs font-medium">กำลังโหลดเมนู...</div>
              ) : filteredRecipes.length === 0 ? (
                <div className="text-center py-12 text-stone-400 text-xs">ไม่พบเมนูเครื่องดื่ม</div>
              ) : (
                <div className="space-y-3">
                  {filteredRecipes.map(recipe => {
                    const qty = cart[recipe.id] || 0;
                    return (
                      <div key={recipe.id} className="bg-white rounded-2xl p-3.5 border border-amber-100/80 custom-shadow flex items-center justify-between gap-3">
                        <div className="flex items-center space-x-3 min-w-0">
                          <img src={recipe.image || DEFAULT_IMAGE} className="w-14 h-14 rounded-2xl object-cover border border-stone-100 shrink-0" alt={recipe.name} />
                          <div className="min-w-0">
                            <h3 className="font-bold text-amber-950 text-sm truncate">{recipe.name}</h3>
                            <span className="text-xs font-black text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md inline-block mt-1">
                              {recipe.price || 35} ฿
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center bg-stone-50 border border-stone-200 rounded-xl p-1 shrink-0">
                          <button
                            onClick={() => handleQtyChange(recipe.id, -1)}
                            disabled={qty === 0}
                            className={`w-8 h-8 rounded-lg font-bold text-base transition flex items-center justify-center ${qty > 0 ? 'bg-white text-stone-700 shadow-sm' : 'text-stone-300'}`}
                          >
                            -
                          </button>
                          <span className="w-8 text-center font-bold text-amber-950 text-sm">{qty}</span>
                          <button
                            onClick={() => handleQtyChange(recipe.id, 1)}
                            className="w-8 h-8 rounded-lg bg-amber-800 text-white font-bold text-base hover:bg-amber-900 transition flex items-center justify-center shadow-sm"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="bg-white rounded-2xl p-4 border border-amber-100 custom-shadow space-y-2">
                <label className="block text-xs font-bold text-stone-700">หมายเหตุถึงร้านค้า (เช่น หวาน 50% / ไม่ใส่มุก)</label>
                <input
                  type="text"
                  placeholder="ระบุความต้องการเพิ่มเติม..."
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  className="w-full px-3 py-2 text-xs rounded-xl bg-stone-50 border border-stone-200 focus:outline-none focus:border-amber-700"
                />
              </div>
            </main>
          </div>

          {/* Sticky Bottom Bar */}
          {selectedList.length > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-200/80 p-4 shadow-2xl z-50">
              <div className="max-w-md mx-auto flex items-center justify-between gap-4">
                <div>
                  <span className="text-[10px] text-stone-400 font-bold block">ยอดรวมทั้งสิ้น ({selectedList.reduce((a,b)=>a+b.qty,0)} รายการ)</span>
                  <span className="text-xl font-black text-amber-900">{grandTotal.toLocaleString()} <span className="text-xs font-normal">บาท</span></span>
                </div>

                <button
                  onClick={handleSubmitOrder}
                  className="px-6 py-3 bg-amber-800 hover:bg-amber-900 text-white font-bold text-sm rounded-2xl shadow-lg transition flex items-center gap-2"
                >
                  <i data-lucide="send" className="w-4 h-4"></i>
                  ส่งออเดอร์
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerOrderApp />);
  </script>
</body>
</html>
