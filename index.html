<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบสต๊อก & ยอดขาย - เศรษฐีชา</title>
  <meta property="og:title" content="ระบบสต๊อก & ยอดขาย - เศรษฐีชา" />
  <meta property="og:description" content="ระบบจัดการสต๊อก สรุปยอดขาย และจัดการสถานะเมนู เศรษฐีชา" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #f7f3ee;
      color: #3d2b1f; 
      -webkit-tap-highlight-color: transparent; 
    }

    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(61, 43, 31, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-input {
      background-color: #fffdfa;
      border: 1.5px solid #e2d7cd;
      color: #3d2b1f;
      transition: all 0.2s ease-in-out;
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #c08552;
      box-shadow: 0 0 0 3px rgba(192, 133, 82, 0.2);
      outline: none;
    }

    input, select, button { touch-action: manipulation; }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      color: #ffffff;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .btn-boba {
      background-color: #8c5a3c;
      box-shadow: 0 4px 14px rgba(140, 90, 60, 0.3);
    }
    .btn-boba:hover { background-color: #6f442b; }

    .btn-dark-boba {
      background-color: #2b1e16;
      box-shadow: 0 4px 14px rgba(43, 30, 22, 0.3);
    }
    .btn-dark-boba:hover { background-color: #1a120d; }

    .a4-container {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        height: auto !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="selection:bg-amber-700 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MASTER_PASSWORD = "Phon1234";

    const firebaseConfig = {
      apiKey: "AIzaSyDCwQ4AIxY5haYIj-Kd-nGNAq_Jn1t_aLk",
      authDomain: "chanomstock.firebaseapp.com",
      projectId: "chanomstock",
      storageBucket: "chanomstock.firebasestorage.app",
      messagingSenderId: "309865099169",
      appId: "1:309865099169:web:d5df7c674180ab845865e0",
      measurementId: "G-Y6HGEXEQWY"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      if (err.code === 'failed-precondition') console.log('Offline Persistence: แท็บซ้ำ');
    });

    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=150';

    const convertUnitToStock = (amount, recipeUnit, stockUnit) => {
      const rUnit = (recipeUnit || '').toLowerCase().trim();
      const sUnit = (stockUnit || '').toLowerCase().trim();

      if (rUnit === sUnit) return amount;
      if ((rUnit === 'กรัม' || rUnit === 'g') && (sUnit === 'กิโลกรัม' || sUnit === 'kg')) return amount / 1000;
      if ((rUnit === 'กิโลกรัม' || rUnit === 'kg') && (sUnit === 'กรัม' || sUnit === 'g')) return amount * 1000;
      if ((rUnit === 'มล.' || rUnit === 'ml') && (sUnit === 'ลิตร' || sUnit === 'l')) return amount / 1000;
      if ((rUnit === 'ลิตร' || rUnit === 'l') && (sUnit === 'มล.' || sUnit === 'ml')) return amount * 1000;

      return amount;
    };

    // MODAL: จัดการหมวดหมู่
    function CategoryModal({ isOpen, onClose, categories, onAddCategory, onDeleteCategory }) {
      const [newCatName, setNewCatName] = useState('');

      if (!isOpen) return null;

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        onAddCategory(newCatName.trim());
        setNewCatName('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 max-h-[85vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-3 border-b border-stone-100 mb-4">
                <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide="tag" className="w-5 h-5 text-amber-700"></i>
                  จัดการหมวดหมู่สินค้า
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form onSubmit={handleAdd} className="flex gap-2 mb-4">
                <input
                  type="text"
                  placeholder="เพิ่มหมวดหมู่ใหม่..."
                  value={newCatName}
                  onChange={(e) => setNewCatName(e.target.value)}
                  className="flex-1 px-3 py-2 text-xs sm:text-sm rounded-xl custom-input"
                />
                <button type="submit" className="bg-amber-700 hover:bg-amber-800 text-white font-bold text-xs px-4 py-2 rounded-xl transition">
                  + เพิ่ม
                </button>
              </form>

              <div className="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
                {categories.map(cat => (
                  <div key={cat.id} className="bg-amber-50/50 border border-amber-200/60 px-3 py-2 rounded-xl flex justify-between items-center text-xs font-semibold text-amber-950">
                    <span>{cat.name}</span>
                    <button onClick={() => onDeleteCategory(cat.id)} className="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50">
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
                {categories.length === 0 && (
                  <div className="text-center py-6 text-stone-400 text-xs italic">ยังไม่มีหมวดหมู่</div>
                )}
              </div>
            </div>

            <div className="pt-4 border-t border-stone-100 mt-4 text-right">
              <button onClick={onClose} className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition">
                ปิด
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: สรุปวัตถุดิบคงเหลือตามหมวดหมู่
    function StockSummaryByCategoryModal({ isOpen, onClose, stocks, categories }) {
      if (!isOpen) return null;

      const categorizedStocks = categories.map(cat => ({
        categoryName: cat.name,
        items: stocks.filter(s => s.category === cat.name)
      }));

      const uncategorizedItems = stocks.filter(s => !s.category || !categories.some(c => c.name === s.category));
      if (uncategorizedItems.length > 0) {
        categorizedStocks.push({
          categoryName: 'ทั่วไป / อื่นๆ',
          items: uncategorizedItems
        });
      }

      const todayStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });

      const handleShare = async () => {
        let text = `📦 สรุปวัตถุดิบคงเหลือร้านเศรษฐีชา (${todayStr})\n------------------------\n`;
        categorizedStocks.forEach(group => {
          if (group.items.length > 0) {
            text += `\n🏷️ [${group.categoryName}]\n`;
            group.items.forEach(item => {
              text += `- ${item.name}: ${item.current} ${item.unit}${Number(item.current) <= Number(item.minAlert || 0) ? ' ⚠️' : ''}\n`;
            });
          }
        });

        if (navigator.share) {
          try {
            await navigator.share({ title: 'สรุปวัตถุดิบคงเหลือ', text });
          } catch (e) { console.log(e); }
        } else {
          navigator.clipboard.writeText(text);
          alert('คัดลอกสรุปรายการลง Clipboard เรียบร้อยแล้ว!');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-stone-900/70 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-2xl max-w-md w-full p-4 sm:p-6 shadow-2xl border border-stone-100 h-[92vh] flex flex-col justify-between">
            <div className="flex justify-between items-center pb-2.5 border-b border-stone-200">
              <div>
                <h3 className="font-bold text-base sm:text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide="clipboard-check" className="w-5 h-5 text-amber-700"></i>
                  สรุปสต๊อกตามหมวดหมู่
                </h3>
                <p className="text-[10px] text-stone-400">ร้านเศรษฐีชา | ประจำวันที่ {todayStr}</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto py-3 space-y-3 no-scrollbar my-1">
              {categorizedStocks.map(catGroup => {
                if (catGroup.items.length === 0) return null;
                return (
                  <div key={catGroup.categoryName} className="bg-amber-50/40 border border-amber-200/60 rounded-xl p-2.5">
                    <div className="font-bold text-xs text-amber-800 border-b border-amber-200/40 pb-1 mb-1.5 flex justify-between">
                      <span>🏷️ {catGroup.categoryName}</span>
                      <span className="text-[10px] text-stone-400 font-normal">({catGroup.items.length} รายการ)</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5">
                      {catGroup.items.map(item => {
                        const isLow = Number(item.current) <= Number(item.minAlert || 0);
                        return (
                          <div key={item.id} className="bg-white px-2 py-1.5 rounded-lg border border-stone-200 flex items-center justify-between text-[11px]">
                            <span className="font-medium text-stone-800 truncate pr-1">{item.name}</span>
                            <span className={`font-bold whitespace-nowrap ${isLow ? 'text-rose-600' : 'text-stone-700'}`}>
                              {item.current} <span className="text-[9px] font-normal text-stone-400">{item.unit}</span>
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="pt-2.5 border-t border-stone-100 flex gap-2">
              <button onClick={handleShare} className="flex-1 py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
                <i data-lucide="share-2" className="w-4 h-4"></i> กดแชร์รายการสรุป
              </button>
              <button onClick={onClose} className="py-2.5 px-4 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition">
                ปิด
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: แก้ไขบันทึกการสั่งซื้อ/ขาย
    function EditProductionLogModal({ isOpen, onClose, logToEdit, onSave }) {
      const [itemsMap, setItemsMap] = useState({});
      const [note, setNote] = useState('');

      useEffect(() => {
        if (logToEdit) {
          setNote(logToEdit.note || '');
          const initialMap = {};
          if (logToEdit.title) {
            const raw = logToEdit.title.replace(/^(สั่งปรุง\/ขาย|ปรุง|สั่งปรุง|ต้ม|ออเดอร์ลูกค้าสแกน:)\s+/, '').split(', ');
            raw.forEach(item => {
              const match = item.match(/(.+) \((\d+) (ถัง|แก้ว|หม้อ|หน่วย)\)/);
              if (match) {
                const name = match[1].trim();
                const count = parseInt(match[2], 10);
                initialMap[name] = count;
              }
            });
          }
          setItemsMap(initialMap);
        }
      }, [logToEdit]);

      if (!isOpen || !logToEdit) return null;

      const handleQtyChange = (name, val) => {
        const num = Math.max(0, parseInt(val, 10) || 0);
        setItemsMap(prev => ({ ...prev, [name]: num }));
      };

      const handleRemoveItem = (name) => {
        setItemsMap(prev => {
          const updated = { ...prev };
          delete updated[name];
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(logToEdit, itemsMap, note);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 max-h-[85vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-3 border-b border-stone-100 mb-4">
                <div>
                  <h3 className="font-bold text-base text-amber-900 flex items-center gap-2">
                    <i data-lucide="edit-3" className="w-5 h-5 text-amber-700"></i>
                    แก้ไขรายการสั่งซื้อ/ขาย
                  </h3>
                  <p className="text-[11px] text-stone-400">ปรับแก้จำนวน หรือลบรายการที่คีย์ผิดออกได้ทันที</p>
                </div>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="editProdForm" onSubmit={handleSubmit} className="space-y-3">
                <div className="max-h-[45vh] overflow-y-auto pr-1 space-y-2">
                  {Object.entries(itemsMap).map(([name, qty]) => (
                    <div key={name} className="bg-stone-50 border border-stone-200 p-2.5 rounded-2xl flex items-center justify-between gap-2">
                      <span className="font-bold text-xs text-stone-800 truncate flex-1">{name}</span>
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          value={qty}
                          onChange={(e) => handleQtyChange(name, e.target.value)}
                          className="w-16 px-2 py-1 text-xs text-center font-bold text-amber-800 bg-white rounded-xl border border-stone-300 focus:outline-none"
                        />
                        <span className="text-[11px] text-stone-400">หน่วย</span>
                        <button
                          type="button"
                          onClick={() => handleRemoveItem(name)}
                          className="p-1 text-rose-500 hover:bg-rose-50 rounded-lg"
                        >
                          <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-2">
                  <label className="block text-xs font-semibold text-stone-600 mb-1">หมายเหตุ</label>
                  <input
                    type="text"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-3 py-2 text-xs rounded-xl custom-input"
                  />
                </div>
              </form>
            </div>

            <div className="pt-3 border-t border-stone-100 flex gap-2 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition">
                ยกเลิก
              </button>
              <button type="submit" form="editProdForm" className="flex-1 py-2.5 bg-amber-700 hover:bg-amber-800 text-white font-bold text-xs rounded-xl shadow-md transition">
                บันทึกการแก้ไข
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: เพิ่ม/แก้ไข วัตถุดิบ
    function StockModal({ isOpen, onClose, onSave, editingStock, handleImageUpload, categories, onOpenCategoryModal }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('');
      const [current, setCurrent] = useState('');
      const [unit, setUnit] = useState('ถัง');
      const [minAlert, setMinAlert] = useState('5');
      const [image, setImage] = useState('');

      useEffect(() => {
        const defaultCat = categories.length > 0 ? categories[0].name : 'ทั่วไป';
        if (editingStock) {
          setName(editingStock.name || '');
          setCategory(editingStock.category || defaultCat);
          setCurrent(editingStock.current !== undefined ? editingStock.current : '');
          setUnit(editingStock.unit || 'ถัง');
          setMinAlert(editingStock.minAlert !== undefined ? editingStock.minAlert : '5');
          setImage(editingStock.image || '');
        } else {
          setName('');
          setCategory(defaultCat);
          setCurrent('');
          setUnit('ถัง');
          setMinAlert('5');
          setImage('');
        }
      }, [editingStock, isOpen, categories]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || current === '') return alert('กรุณากรอกชื่อวัตถุดิบและจำนวนคงเหลือ');
        onSave({
          id: editingStock ? editingStock.id : undefined,
          name,
          category,
          current: Number(current),
          unit,
          minAlert: Number(minAlert),
          image
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-5">
              <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                <i data-lucide={editingStock ? "edit-3" : "plus-circle"} className="w-5 h-5 text-amber-700"></i>
                {editingStock ? 'แก้ไขรายการวัตถุดิบ' : 'เพิ่มวัตถุดิบใหม่เข้าระบบ'}
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">ชื่อวัตถุดิบ <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="เช่น ชาตรามือ / นมสด / ไข่มุก" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="block text-xs font-semibold text-stone-600">หมวดหมู่</label>
                  <button type="button" onClick={onOpenCategoryModal} className="text-[11px] text-amber-700 font-bold hover:underline">⚙️ จัดการหมวดหมู่</button>
                </div>
                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-3 text-sm rounded-xl custom-input">
                  {categories.map((cat) => (
                    <option key={cat.id} value={cat.name}>{cat.name}</option>
                  ))}
                  {categories.length === 0 && <option value="ทั่วไป">ทั่วไป</option>}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">หน่วยเรียกหลัก <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="เช่น ถุง, กิโลกรัม, ลิตร, ถัง" value={unit} onChange={e => setUnit(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">จำนวนปัจจุบัน <span className="text-rose-500">*</span></label>
                  <input type="number" step="any" placeholder="0" value={current} onChange={e => setCurrent(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">จุดเตือนสั่งเพิ่ม (Min Alert)</label>
                  <input type="number" step="any" placeholder="5" value={minAlert} onChange={e => setMinAlert(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">รูปภาพวัตถุดิบ</label>
                <div className="flex items-center space-x-3">
                  <img src={image || DEFAULT_IMAGE} className="w-14 h-14 rounded-xl object-cover border border-stone-200" alt="พรีวิววัตถุดิบ" />
                  <input 
                    type="file" 
                    accept="image/*" 
                    onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} 
                    className="text-xs text-stone-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-900 hover:file:bg-amber-200" 
                  />
                </div>
              </div>

              <div className="pt-4 flex gap-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-700/20 transition">บันทึกข้อมูล</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL: เติมวัตถุดิบเข้าคลัง
    function RestockModal({ isOpen, onClose, stocks, categories, onConfirmBatchRestock }) {
      const [restockQtyMap, setRestockQtyMap] = useState({});
      const [note, setNote] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      useEffect(() => {
        if (isOpen) {
          const initialMap = {};
          stocks.forEach(s => { initialMap[s.id] = ''; });
          setRestockQtyMap(initialMap);
          setNote('');
          setSelectedCategory('all');
        }
      }, [isOpen, stocks]);

      if (!isOpen) return null;

      const filteredStocks = stocks.filter(s => selectedCategory === 'all' || s.category === selectedCategory);

      const handleQtyChange = (stockId, val) => {
        setRestockQtyMap(prev => ({ ...prev, [stockId]: val }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirmBatchRestock(restockQtyMap, note);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-3">
                <div>
                  <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                    <i data-lucide="plus-circle" className="w-5 h-5 text-amber-700"></i>
                    📥 เติมวัตถุดิบเข้าคลัง (Restock Batch)
                  </h3>
                  <p className="text-xs text-stone-400 mt-0.5">ใส่จำนวนที่ต้องการเติมลงในช่องของแต่ละวัตถุดิบ</p>
                </div>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-3 mb-2 border-b border-stone-100">
                <button
                  type="button"
                  onClick={() => setSelectedCategory('all')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                    selectedCategory === 'all'
                      ? 'bg-amber-700 text-white shadow-md shadow-amber-700/20'
                      : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                  }`}
                >
                  ทั้งหมด
                </button>
                {categories.map((cat) => (
                  <button
                    key={cat.id}
                    type="button"
                    onClick={() => setSelectedCategory(cat.name)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                      selectedCategory === cat.name
                        ? 'bg-amber-700 text-white shadow-md shadow-amber-700/20'
                        : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                    }`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>

              <form id="restockForm" onSubmit={handleSubmit} className="space-y-4">
                <div className="max-h-[45vh] overflow-y-auto pr-1 space-y-3">
                  {filteredStocks.map(stock => {
                    const isLow = Number(stock.current) <= Number(stock.minAlert || 0);
                    return (
                      <div key={stock.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${isLow ? 'bg-rose-50/50 border-rose-200' : 'bg-amber-50/20 border-amber-200/50'}`}>
                        <div className="flex-1 min-w-0 flex items-center gap-3">
                          <img src={stock.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-lg object-cover border" alt={stock.name} />
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-sm text-amber-950 truncate">{stock.name}</span>
                              {isLow && <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold">ใกล้หมด</span>}
                            </div>
                            <span className="text-xs text-stone-400">ปัจจุบัน: <strong className="text-stone-700">{stock.current}</strong> {stock.unit}</span>
                          </div>
                        </div>
                        <div className="w-36 flex items-center space-x-1.5">
                          <span className="text-xs font-bold text-amber-700">+</span>
                          <input
                            type="number"
                            step="any"
                            placeholder="0"
                            value={restockQtyMap[stock.id] || ''}
                            onChange={(e) => handleQtyChange(stock.id, e.target.value)}
                            className="w-full px-3 py-2 text-sm text-center font-bold text-amber-800 bg-white rounded-xl border border-stone-300 focus:border-amber-700 focus:outline-none"
                          />
                          <span className="text-xs text-stone-400 whitespace-nowrap min-w-[30px]">{stock.unit}</span>
                        </div>
                      </div>
                    );
                  })}
                  {filteredStocks.length === 0 && (
                    <div className="text-center py-8 text-stone-400 text-xs italic">ไม่พบวัตถุดิบในหมวดหมู่นี้</div>
                  )}
                </div>

                <div className="pt-2">
                  <label className="block text-xs font-semibold text-stone-600 mb-1">หมายเหตุการเติมวัตถุดิบ</label>
                  <input
                    type="text"
                    placeholder="เช่น เติมวัตถุดิบประจำวัน..."
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-4 py-2.5 text-sm rounded-xl custom-input"
                  />
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-stone-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="restockForm" className="flex-1 py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-700/20 transition">บันทึกการเติมสต๊อก</button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: ยืนยันการลบประวัติ
    function DeleteLogModal({ isOpen, onClose, logToDelete, onConfirmDelete }) {
      if (!isOpen || !logToDelete) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 text-center">
            <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <i data-lucide="alert-circle" className="w-6 h-6"></i>
            </div>
            <h3 className="font-bold text-base text-stone-800 mb-1">ยืนยันการลบประวัติรายการ</h3>
            <p className="text-xs text-stone-500 mb-2 font-medium">"{logToDelete.title}"</p>
            <p className="text-xs text-rose-600 font-bold mb-4">⚠️ การลบรายการนี้จะทำการลบยอดขายของออเดอร์นี้ออกจากระบบด้วย</p>

            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-left mb-5">
              <p className="text-xs text-amber-900 font-semibold mb-1">คุณต้องการปรับคืนค่าสต๊อกวัตถุดิบเดิมหรือไม่?</p>
              <p className="text-[11px] text-amber-800/80">
                • <b>คืนค่าสต๊อก:</b> ดึงวัตถุดิบที่ถูกตัดไปคืนกลับเข้าคลังสต๊อก + ลบยอดขาย<br/>
                • <b>ไม่คืนค่าสต๊อก:</b> ลบประวัติและยอดขายออกเฉยๆ (ไม่คืนสต๊อก)
              </p>
            </div>

            <div className="flex flex-col gap-2">
              <button
                type="button"
                onClick={() => onConfirmDelete(true)}
                className="w-full py-3 bg-amber-800 hover:bg-amber-900 text-white font-bold text-xs sm:text-sm rounded-xl transition shadow-md"
              >
                🔄 คืนค่าสต๊อกเดิม & ลบยอดขาย/ประวัติ
              </button>
              <button
                type="button"
                onClick={() => onConfirmDelete(false)}
                className="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs sm:text-sm rounded-xl transition shadow-md"
              >
                🗑️ ลบเฉพาะยอดขาย & ประวัติ (ไม่คืนสต๊อก)
              </button>
              <button
                type="button"
                onClick={onClose}
                className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition mt-1"
              >
                ยกเลิก
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: สรุปรายงานประจำวัน (A4)
    function PrintSummaryModal({ isOpen, onClose, logs, lowStockItems }) {
      if (!isOpen) return null;

      const todayStr = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

      const todayLogs = logs.filter(l => {
        if (!l.datetime) return false;
        const now = new Date();
        const d = now.getDate().toString().padStart(2, '0');
        const m = (now.getMonth() + 1).toString().padStart(2, '0');
        const y = now.getFullYear() + 543;
        return l.datetime.includes(`${d}/${m}/${y}`);
      });

      const productionLogs = todayLogs.filter(l => l.type === 'สั่งปรุง/ขาย' || l.type === 'ปรุงผลิต');
      let totalBuckets = 0;
      const recipeSummary = {};

      productionLogs.forEach(l => {
        if (l.title) {
          const items = l.title.replace(/^(สั่งปรุง\/ขาย|ปรุง|ต้ม|ออเดอร์ลูกค้าสแกน:)\s+/, '').split(', ');
          items.forEach(item => {
            const match = item.match(/(.+) \((\d+) (ถัง|แก้ว|หม้อ|หน่วย)\)/);
            if (match) {
              const name = match[1].trim();
              const count = parseInt(match[2], 10);
              recipeSummary[name] = (recipeSummary[name] || 0) + count;
              totalBuckets += count;
            }
          });
        }
      });

      const handlePrint = () => { window.print(); };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-stone-900/75 backdrop-blur-md animate-fade-in overflow-y-auto">
          <div className="flex flex-col items-center w-full max-w-2xl my-auto">
            
            <div id="printable-report" className="a4-container rounded-2xl sm:rounded-3xl p-5 sm:p-8 text-stone-800 flex flex-col justify-between border border-stone-200">
              <div>
                <div className="border-b-2 border-stone-900 pb-3 mb-4 flex justify-between items-end">
                  <div>
                    <h1 className="text-base sm:text-2xl font-black text-amber-950 tracking-tight">📄 รายงานสรุปประจำวัน</h1>
                    <p className="text-[11px] sm:text-xs font-semibold text-stone-600 mt-0.5">เศรษฐีชา | วันที่: {todayStr}</p>
                  </div>
                  <div className="text-right text-[10px] sm:text-xs text-stone-400 font-mono">
                    DAILY-REPORT
                  </div>
                </div>

                <div className="mb-4 bg-amber-50/60 p-3 sm:p-4 rounded-xl border border-amber-200">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold text-amber-950 text-xs sm:text-sm flex items-center gap-1.5">
                      🧋 สรุปการขายประจำวัน
                    </h3>
                    <span className="text-[10px] sm:text-xs font-extrabold bg-amber-200/60 text-amber-900 px-2.5 py-0.5 rounded-full">
                      รวม {totalBuckets} รายการ
                    </span>
                  </div>

                  {Object.keys(recipeSummary).length === 0 ? (
                    <div className="text-[11px] text-stone-400 italic">ยังไม่มีบันทึกการขายในวันนี้</div>
                  ) : (
                    <div className="grid grid-cols-2 gap-1.5 text-[11px] sm:text-xs">
                      {Object.entries(recipeSummary).map(([name, count]) => (
                        <div key={name} className="bg-white px-2.5 py-1.5 rounded-lg border border-stone-200 flex justify-between items-center">
                          <span className="font-medium text-stone-700 truncate">{name}</span>
                          <span className="font-bold text-amber-800 ml-1 whitespace-nowrap">{count} หน่วย</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="mb-4 bg-rose-50/60 p-3 sm:p-4 rounded-xl border border-rose-200">
                  <h3 className="font-bold text-rose-800 text-xs sm:text-sm mb-2 flex items-center gap-1.5">
                    ⚠️ วัตถุดิบใกล้หมด / ต้องสั่งซื้อเพิ่ม ({lowStockItems.length} รายการ)
                  </h3>

                  {lowStockItems.length === 0 ? (
                    <div className="text-[11px] text-stone-500 italic">ไม่มีวัตถุดิบใกล้หมด สต๊อกอยู่ในเกณฑ์ปกติ</div>
                  ) : (
                    <div className="grid grid-cols-2 gap-1.5 text-[11px] sm:text-xs">
                      {lowStockItems.map(s => (
                        <div key={s.id} className="bg-white px-2.5 py-1.5 rounded-lg border border-rose-200 flex justify-between items-center">
                          <span className="font-medium text-stone-800 truncate">{s.name}</span>
                          <span className="font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded ml-1 whitespace-nowrap">
                            เหลือ {s.current} {s.unit}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="pt-6 mt-6 border-t border-stone-200 grid grid-cols-2 text-center text-[10px] text-stone-400">
                <div>ลงชื่อผู้รายงาน: ............................................</div>
                <div>ลงชื่อผู้รับเรื่อง: ............................................</div>
              </div>
            </div>

            <div className="w-full max-w-2xl pt-3 flex gap-2.5 no-print">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-800 hover:bg-stone-700 text-white font-bold text-xs sm:text-sm rounded-2xl transition shadow-lg">
                ปิดหน้าต่าง
              </button>
              <button type="button" onClick={handlePrint} className="flex-1 py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold text-xs sm:text-sm rounded-2xl shadow-lg shadow-amber-700/30 transition flex items-center justify-center gap-2">
                <i data-lucide="printer" className="w-4 h-4"></i> พิมพ์ / สั่งพิมพ์ PDF
              </button>
            </div>

          </div>
        </div>
      );
    }

    // MODAL: เพิ่ม/แก้ไข สูตร BOM
    function RecipeModal({ isOpen, onClose, onSave, editingRecipe, stocks, handleImageUpload }) {
      const [name, setName] = useState('');
      const [yieldInfo, setYieldInfo] = useState('1 แก้ว');
      const [price, setPrice] = useState(35);
      const [image, setImage] = useState('');
      const [ingredients, setIngredients] = useState([]);

      useEffect(() => {
        if (editingRecipe) {
          setName(editingRecipe.name || '');
          setYieldInfo(editingRecipe.yieldInfo || '1 แก้ว');
          setPrice(editingRecipe.price !== undefined ? editingRecipe.price : 35);
          setImage(editingRecipe.image || '');
          setIngredients(editingRecipe.ingredients || []);
        } else {
          setName('');
          setYieldInfo('1 แก้ว');
          setPrice(35);
          setImage('');
          setIngredients([]);
        }
      }, [editingRecipe, isOpen]);

      if (!isOpen) return null;

      const handleAddIngredient = () => {
        if (stocks.length === 0) return alert('กรุณาเพิ่มวัตถุดิบในคลังก่อนสร้างสูตร');
        const defaultStock = stocks[0];
        setIngredients(prev => [...prev, { stockId: defaultStock.id, amount: '', unit: defaultStock.unit || 'กรัม' }]);
      };

      const handleRemoveIngredient = (index) => {
        setIngredients(prev => prev.filter((_, i) => i !== index));
      };

      const handleIngredientChange = (index, field, value) => {
        setIngredients(prev => {
          const updated = [...prev];
          if (field === 'stockId') {
            const selectedStock = stocks.find(s => s.id === value);
            updated[index] = { 
              ...updated[index], 
              stockId: value, 
              unit: selectedStock ? selectedStock.unit : 'กรัม' 
            };
          } else {
            updated[index] = { ...updated[index], [field]: value };
          }
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) return alert('กรุณาระบุชื่อสูตร/เมนู');
        if (ingredients.length === 0) return alert('กรุณาเพิ่มส่วนผสมอย่างน้อย 1 รายการ');

        for (let ing of ingredients) {
          if (!ing.stockId || !ing.amount || Number(ing.amount) <= 0) {
            return alert('กรุณากรอกปริมาณส่วนผสมให้ครบถ้วนและถูกต้อง');
          }
        }

        onSave({
          id: editingRecipe ? editingRecipe.id : undefined,
          name,
          yieldInfo,
          price: Number(price),
          image,
          ingredients: ingredients.map(i => ({ 
            stockId: i.stockId, 
            amount: Number(i.amount),
            unit: i.unit || 'กรัม'
          }))
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] flex flex-col justify-between">
            <div className="overflow-y-auto pr-1">
              <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-5">
                <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide={editingRecipe ? "edit-3" : "book-open"} className="w-5 h-5 text-amber-700"></i>
                  {editingRecipe ? 'แก้ไขสูตร & ราคาขาย' : 'เพิ่มสูตรเมนูใหม่ (BOM)'}
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="recipeForm" onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">ชื่อสูตร / เมนูเครื่องดื่ม <span className="text-rose-500">*</span></label>
                  <input type="text" placeholder="เช่น ชานมไต้หวัน / ชาไทยเข้มข้น" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-stone-600 mb-1">ราคาขายต่อหน่วย (บาท) <span className="text-rose-500">*</span></label>
                    <input type="number" min="0" placeholder="35" value={price} onChange={e => setPrice(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input font-bold text-amber-800" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-600 mb-1">ปริมาณเรียกผลิต</label>
                    <input type="text" placeholder="เช่น 1 แก้ว / 1 ถัง" value={yieldInfo} onChange={e => setYieldInfo(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">รูปภาพประกอบ</label>
                  <div className="flex items-center space-x-3">
                    <img src={image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-stone-200" alt="พรีวิวสูตร" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} className="text-xs text-stone-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-900 hover:file:bg-amber-200" />
                  </div>
                </div>

                <div className="pt-2 border-t border-stone-100">
                  <div className="flex justify-between items-center mb-3">
                    <label className="text-xs font-bold text-stone-700">รายการส่วนผสมที่ใช้ <span className="text-rose-500">*</span></label>
                    <button type="button" onClick={handleAddIngredient} className="text-xs font-bold text-amber-800 hover:text-amber-900 bg-amber-100/60 px-3 py-1.5 rounded-lg flex items-center gap-1">
                      <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มวัตถุดิบ
                    </button>
                  </div>

                  {ingredients.length === 0 ? (
                    <div className="text-center py-6 border-2 border-dashed border-stone-200 rounded-2xl text-xs text-stone-400">
                      ยังไม่มีส่วนผสม กดปุ่ม "+ เพิ่มวัตถุดิบ" ด้านบนเพื่อระบุส่วนผสม
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {ingredients.map((ing, idx) => (
                        <div key={idx} className="flex items-center space-x-2 bg-stone-50 p-2.5 rounded-xl border border-stone-200">
                          <select
                            value={ing.stockId}
                            onChange={(e) => handleIngredientChange(idx, 'stockId', e.target.value)}
                            className="flex-1 px-2.5 py-2 text-xs rounded-lg custom-input font-medium"
                          >
                            {stocks.map(s => (
                              <option key={s.id} value={s.id}>{s.name}</option>
                            ))}
                          </select>

                          <input
                            type="number"
                            step="any"
                            placeholder="จำนวน"
                            value={ing.amount}
                            onChange={(e) => handleIngredientChange(idx, 'amount', e.target.value)}
                            className="w-20 px-2 py-2 text-xs rounded-lg custom-input font-bold text-center"
                          />

                          <input
                            type="text"
                            placeholder="หน่วย"
                            value={ing.unit || ''}
                            onChange={(e) => handleIngredientChange(idx, 'unit', e.target.value)}
                            className="w-16 px-2 py-2 text-xs rounded-lg custom-input text-center"
                          />

                          <button type="button" onClick={() => handleRemoveIngredient(idx)} className="p-1.5 text-stone-400 hover:text-rose-600 rounded-lg">
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-stone-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="recipeForm" className="flex-1 py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-700/20 transition">บันทึกสูตร & ราคา</button>
            </div>
          </div>
        </div>
      );
    }

    // MAIN APP COMPONENT
    function App() {
      const [activeTab, setActiveTab] = useState('ordersTab');

      const [stocks, setStocks] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [logs, setLogs] = useState([]);
      const [salesLogs, setSalesLogs] = useState([]);
      const [categories, setCategories] = useState([]);
      const [pendingOrders, setPendingOrders] = useState([]);
      const [loading, setLoading] = useState(true);

      // Accordion state for Daily Sales Logs
      const [showDailyLogs, setShowDailyLogs] = useState(false);

      // Search & Filter States
      const [searchStock, setSearchStock] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchRecipe, setSearchRecipe] = useState('');
      const [searchMenuManage, setSearchMenuManage] = useState('');
      const [searchHistory, setSearchHistory] = useState('');

      // Daily Sales Filter Date State (ดูย้อนหลังได้)
      const [selectedDailyDate, setSelectedDailyDate] = useState(() => {
        const d = new Date();
        const year = d.getFullYear();
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        return `${year}-${month}-${day}`;
      });

      // Month Filter State for Sales Summary
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2, '0')}`;
      });

      // Hidden items states for history
      const [unlockedLogDetails, setUnlockedLogDetails] = useState({});

      // Modals
      const [stockModalOpen, setStockModalOpen] = useState(false);
      const [editingStock, setEditingStock] = useState(null);

      const [restockModalOpen, setRestockModalOpen] = useState(false);
      const [printModalOpen, setPrintModalOpen] = useState(false);

      const [recipeModalOpen, setRecipeModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);

      const [categoryModalOpen, setCategoryModalOpen] = useState(false);
      const [stockCategorySummaryModalOpen, setStockCategorySummaryModalOpen] = useState(false);

      const [productionToEdit, setProductionToEdit] = useState(null);
      const [logToDelete, setLogToDelete] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Firebase Listener
      useEffect(() => {
        const unsubCategories = db.collection('categories').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          if (data.length === 0) {
            const defaults = ['น้ำปรุงรส', 'ชา/กาแฟ', 'วัตถุดิบหลัก', 'ท็อปปิ้ง', 'บรรจุภัณฑ์'];
            defaults.forEach(cat => db.collection('categories').add({ name: cat }));
          } else {
            setCategories(data);
          }
        });

        const unsubStocks = db.collection('stocks').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setStocks(data);
          setLoading(false);
        });

        const unsubRecipes = db.collection('recipes').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRecipes(data);
        });

        const unsubLogs = db.collection('logs').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return {
              id: doc.id,
              ...docData,
              createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now()
            };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setLogs(data);
        });

        const unsubSales = db.collection('sales').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return {
              id: doc.id,
              ...docData,
              createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now()
            };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setSalesLogs(data);
        });

        // Listener ดึงออเดอร์ลูกค้าสแกนสั่ง Real-time
        const unsubOrders = db.collection('orders').where('status', '==', 'pending').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return {
              id: doc.id,
              ...docData,
              createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now()
            };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setPendingOrders(data);
        });

        return () => {
          unsubCategories();
          unsubStocks();
          unsubRecipes();
          unsubLogs();
          unsubSales();
          unsubOrders();
        };
      }, []);

      const handleTabChange = (tabName) => {
        setActiveTab(tabName);
      };

      // สลับสถานะเปิด/ปิดการขายเมนู
      const handleToggleMenuAvailability = async (recipe) => {
        const currentStatus = recipe.isAvailable !== false;
        const newStatus = !currentStatus;
        try {
          await db.collection('recipes').doc(recipe.id).update({
            isAvailable: newStatus
          });
        } catch (err) {
          console.error("Error toggling menu availability:", err);
          alert("ไม่สามารถเปลี่ยนสถานะเมนูได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      // ยืนยันรับออเดอร์ที่ลูกค้าสแกนสั่ง -> ตัดสต๊อก + คิดเงิน + บันทึกขาย
      const handleAcceptCustomerOrder = async (order) => {
        try {
          const batch = db.batch();
          const deductionsSummary = {};

          order.items.forEach(item => {
            const recipe = recipes.find(r => r.id === item.recipeId || r.name === item.menuName);
            if (recipe && recipe.ingredients) {
              recipe.ingredients.forEach(ing => {
                const stockItem = stocks.find(s => s.id === ing.stockId);
                if (stockItem) {
                  const rawAmount = Number(ing.amount) * item.qty;
                  const convertedAmount = convertUnitToStock(rawAmount, ing.unit, stockItem.unit);
                  deductionsSummary[ing.stockId] = (deductionsSummary[ing.stockId] || 0) + convertedAmount;
                }
              });
            }
          });

          // ตัดสต๊อกวัตถุดิบ
          Object.entries(deductionsSummary).forEach(([stockId, deductAmount]) => {
            const stockRef = db.collection('stocks').doc(stockId);
            batch.update(stockRef, {
              current: firebase.firestore.FieldValue.increment(-deductAmount)
            });
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear();
          const yearTH = year + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${yearTH} ${hours}:${mins} น.`;
          const dateISO = `${year}-${month}-${day}`;

          const logRef = db.collection('logs').doc();
          const newLogId = logRef.id;

          const titleText = order.items.map(i => `${i.menuName} (${i.qty} แก้ว)`).join(', ');
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'สั่งปรุง/ขาย',
            title: `ออเดอร์ลูกค้าสแกน: ${titleText}`,
            details: Object.entries(deductionsSummary).map(([sId, amt]) => {
              const s = stocks.find(item => item.id === sId);
              return `${s ? s.name : 'วัตถุดิบ'}: -${amt.toFixed(2)} ${s ? s.unit : ''}`;
            }),
            rawDeductions: deductionsSummary,
            totalAmount: order.totalPrice,
            note: order.note || 'ลูกค้าสแกนสั่งหน้าร้าน'
          });

          // บันทึกลง Sales
          order.items.forEach(item => {
            const saleRef = db.collection('sales').doc();
            batch.set(saleRef, {
              logId: newLogId,
              recipeId: item.recipeId || '',
              menuName: item.menuName,
              cups: Number(item.qty),
              pricePerCup: Number(item.price),
              totalAmount: Number(item.totalPrice),
              note: order.note || '',
              datetime: timeStr,
              dateISO: dateISO,
              monthKey: `${year}-${month}`,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          });

          // เปลี่ยนสถานะออเดอร์เป็น completed
          const orderRef = db.collection('orders').doc(order.id);
          batch.update(orderRef, { status: 'completed' });

          await batch.commit();
          alert(`✅ ยืนยันรับออเดอร์ คิดเงิน (${order.totalPrice.toLocaleString()} ฿) และตัดสต๊อกเรียบร้อยแล้ว!`);
        } catch (err) {
          console.error("Error accepting order:", err);
          alert('เกิดข้อผิดพลาดในการรับออเดอร์');
        }
      };

      // ยกเลิกออเดอร์ลูกค้าสแกน
      const handleCancelCustomerOrder = async (orderId) => {
        if (confirm('คุณต้องการยกเลิกออเดอร์นี้ใช่หรือไม่?')) {
          await db.collection('orders').doc(orderId).update({ status: 'cancelled' });
        }
      };

      const handleDeleteSale = async (id) => {
        if (confirm('คุณต้องการลบรายการขายนี้ใช่หรือไม่?')) {
          await db.collection('sales').doc(id).delete();
        }
      };

      // Sales Calculations
      const todayISO = useMemo(() => {
        const d = new Date();
        const year = d.getFullYear();
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        return `${year}-${month}-${day}`;
      }, []);

      // คำนวณสรุปยอดขายตามวันที่เลือก (ดูย้อนหลังได้)
      const selectedDailySalesSummary = useMemo(() => {
        const targetLogs = salesLogs.filter(s => s.dateISO === selectedDailyDate);
        const totalMoney = targetLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        const totalCups = targetLogs.reduce((acc, curr) => acc + (curr.cups || 0), 0);
        return { totalMoney, totalCups, count: targetLogs.length, logs: targetLogs };
      }, [salesLogs, selectedDailyDate]);

      // สรุปยอดขายวันนี้สำหรับแสดงบน Header
      const todaySalesSummary = useMemo(() => {
        const todayLogs = salesLogs.filter(s => s.dateISO === todayISO);
        const totalMoney = todayLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        return { totalMoney };
      }, [salesLogs, todayISO]);

      const monthSalesSummary = useMemo(() => {
        const monthLogs = salesLogs.filter(s => s.monthKey === selectedMonth);
        const totalMoney = monthLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        const totalCups = monthLogs.reduce((acc, curr) => acc + (curr.cups || 0), 0);
        
        const uniqueDays = new Set(monthLogs.map(s => s.dateISO)).size;
        const avgDailyMoney = uniqueDays > 0 ? Math.round(totalMoney / uniqueDays) : 0;

        return { totalMoney, totalCups, count: monthLogs.length, uniqueDays, avgDailyMoney, monthLogs };
      }, [salesLogs, selectedMonth]);

      const handleToggleShowDetails = (logId) => {
        if (unlockedLogDetails[logId]) {
          setUnlockedLogDetails(prev => ({ ...prev, [logId]: false }));
        } else {
          const pass = prompt('🔐 กรุณากรอกรหัสผ่านเพื่อดูวัตถุดิบที่ใช้ไป:');
          if (pass === MASTER_PASSWORD) {
            setUnlockedLogDetails(prev => ({ ...prev, [logId]: true }));
          } else if (pass !== null) {
            alert('❌ รหัสผ่านไม่ถูกต้อง');
          }
        }
      };

      const handleAddCategory = async (catName) => {
        if (categories.some(c => c.name.toLowerCase() === catName.toLowerCase())) {
          return alert('หมวดหมู่นี้มีอยู่แล้ว');
        }
        await db.collection('categories').add({ name: catName });
      };

      const handleDeleteCategory = async (catId) => {
        if (confirm('คุณต้องการลบหมวดหมู่นี้ใช่หรือไม่?')) {
          await db.collection('categories').doc(catId).delete();
        }
      };

      const filteredStocks = useMemo(() => {
        return stocks.filter(s => {
          const matchSearch = s.name.toLowerCase().includes(searchStock.toLowerCase()) || 
                             (s.category && s.category.toLowerCase().includes(searchStock.toLowerCase()));
          const matchCategory = selectedCategory === 'all' || s.category === selectedCategory;
          return matchSearch && matchCategory;
        });
      }, [stocks, searchStock, selectedCategory]);

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchRecipe.toLowerCase()));
      }, [recipes, searchRecipe]);

      const filteredManageRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchMenuManage.toLowerCase()));
      }, [recipes, searchMenuManage]);

      const filteredLogs = useMemo(() => {
        const prodLogs = logs.filter(l => l.type === 'สั่งปรุง/ขาย' || l.type === 'ปรุงผลิต');
        return prodLogs.filter(l => 
          (l.title && l.title.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.type && l.type.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.note && l.note.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (Array.isArray(l.details) && l.details.some(d => d.toLowerCase().includes(searchHistory.toLowerCase())))
        );
      }, [logs, searchHistory]);

      const lowStockItems = useMemo(() => {
        return stocks.filter(item => {
          const currentVal = Number(item.current) || 0;
          const minVal = Number(item.minAlert) || 0;
          return currentVal <= minVal;
        });
      }, [stocks]);

      const handleImageUpload = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 1.2 * 1024 * 1024) {
            alert("รูปภาพมีขนาดใหญ่เกินไป กรุณาใช้รูปขนาดไม่เกิน 1.2MB ครับ");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => callback(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProductionEdit = async (logItem, updatedItemsMap, newNote) => {
        try {
          const titleText = Object.entries(updatedItemsMap)
            .map(([name, qty]) => `${name} (${qty} หน่วย)`)
            .join(', ');

          const logRef = db.collection('logs').doc(logItem.id);
          await logRef.update({
            title: titleText ? `ออเดอร์: ${titleText}` : 'ยกเลิกรายการสั่งปรุง',
            note: newNote
          });

          setProductionToEdit(null);
          alert('แก้ไขบันทึกเรียบร้อยแล้ว!');
        } catch (e) {
          console.error(e);
          alert('เกิดข้อผิดพลาดในการแก้ไข');
        }
      };

      // ลบประวัติสั่งปรุง/ขาย พร้อมลบยอดขายที่เกี่ยวข้องออกด้วยอัตโนมัติ
      const handleConfirmDeleteLog = async (shouldRestore) => {
        if (!logToDelete) return;

        try {
          const batch = db.batch();

          // 1. ถ้าเลือกคืนค่าสต๊อก
          if (shouldRestore && logToDelete.rawDeductions) {
            Object.entries(logToDelete.rawDeductions).forEach(([sId, amount]) => {
              const stockRef = db.collection('stocks').doc(sId);
              batch.update(stockRef, {
                current: firebase.firestore.FieldValue.increment(Number(amount))
              });
            });
          }

          // 2. ค้นหาและลบยอดขายใน collection sales ที่ผูกกับ log นี้
          const relatedSales = salesLogs.filter(s => s.logId === logToDelete.id);
          relatedSales.forEach(s => {
            const saleRef = db.collection('sales').doc(s.id);
            batch.delete(saleRef);
          });

          // 3. ลบเอกสาร Log
          const logRef = db.collection('logs').doc(logToDelete.id);
          batch.delete(logRef);

          await batch.commit();
          alert('ลบประวัติพร้อมปรับลบยอดขายและสต๊อกเรียบร้อยแล้ว!');
          setLogToDelete(null);
        } catch (e) {
          console.error(e);
          alert('เกิดข้อผิดพลาดในการลบรายการประวัติ');
        }
      };

      // Stock Handlers
      const handleDeleteStock = async (id) => {
        if (confirm('คุณต้องการลบวัตถุดิบรายการนี้ใช่หรือไม่?')) {
          await db.collection('stocks').doc(id).delete();
        }
      };

      const handleSaveStock = async (stockData) => {
        try {
          if (stockData.id) {
            const id = stockData.id;
            delete stockData.id;
            await db.collection('stocks').doc(id).update(stockData);
          } else {
            delete stockData.id;
            await db.collection('stocks').add(stockData);
          }
          setStockModalOpen(false);
          alert('บันทึกข้อมูลวัตถุดิบเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving stock:", err);
          alert("ไม่สามารถบันทึกวัตถุดิบได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      const handleBatchRestock = async (restockItemsMap, globalNote) => {
        try {
          const itemsToProcess = Object.entries(restockItemsMap).filter(([_, qty]) => Number(qty) > 0);
          if (itemsToProcess.length === 0) return alert('กรุณาระบุจำนวนวัตถุดิบที่ต้องการเติมอย่างน้อย 1 รายการ');

          const batch = db.batch();
          const detailsList = [];
          const rawRestock = {};

          itemsToProcess.forEach(([stockId, qty]) => {
            const stockItem = stocks.find(s => s.id === stockId);
            const amount = Number(qty);
            if (stockItem && amount > 0) {
              const stockRef = db.collection('stocks').doc(stockId);
              batch.update(stockRef, {
                current: firebase.firestore.FieldValue.increment(amount)
              });
              detailsList.push(`${stockItem.name}: +${amount} ${stockItem.unit}`);
              rawRestock[stockId] = amount;
            }
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'เติมสต๊อก',
            title: `เติมวัตถุดิบเข้าคลัง (${itemsToProcess.length} รายการ)`,
            details: detailsList,
            rawRestock: rawRestock,
            note: globalNote || 'เติมวัตถุดิบประจำวัน'
          });

          await batch.commit();
          setRestockModalOpen(false);
          alert(`เติมสต๊อกเรียบร้อยแล้วทั้งหมด ${itemsToProcess.length} รายการ!`);
        } catch (err) {
          console.error("Batch Restock error:", err);
          alert("เกิดข้อผิดพลาดในการเติมสต๊อก");
        }
      };

      // BOM Handlers
      const handleDeleteRecipe = async (id) => {
        if (confirm('คุณต้องการลบสูตรวัตถุดิบนี้ใช่หรือไม่?')) {
          await db.collection('recipes').doc(id).delete();
        }
      };

      const handleSaveRecipe = async (recipeObj) => {
        try {
          if (recipeObj.id) {
            const id = recipeObj.id;
            delete recipeObj.id;
            await db.collection('recipes').doc(id).update(recipeObj);
          } else {
            delete recipeObj.id;
            await db.collection('recipes').add({
              ...recipeObj,
              isAvailable: true // ตั้งค่าเริ่มต้นให้เปิดขายทันที
            });
          }
          setRecipeModalOpen(false);
          alert('บันทึกสูตรเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving recipe:", err);
          alert("ไม่สามารถบันทึกสูตรได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header */}
            <header className="bg-white border-b border-amber-200/60 sticky top-0 z-40 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between border-b border-stone-100 sm:border-none">
                <div className="flex items-center space-x-2.5">
                  <div className="bg-amber-800 text-amber-100 p-2 rounded-2xl shadow-md shadow-amber-900/20">
                    <i data-lucide="cup-soda" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-amber-950 text-base sm:text-lg tracking-tight leading-none">เศรษฐีชา</h1>
                    <p className="text-[10px] text-amber-800/70 font-semibold mt-0.5">ระบบจัดการสต๊อก & สรุปยอดขาย</p>
                  </div>
                </div>

                <div className="flex items-center space-x-1.5 sm:space-x-2">
                  <button onClick={() => setActiveTab('salesSummary')} className="bg-amber-800 hover:bg-amber-900 text-amber-50 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-md transition">
                    <i data-lucide="trending-up" className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-300"></i>
                    <span>ยอดขายวันนี้: {todaySalesSummary.totalMoney.toLocaleString()} ฿</span>
                  </button>

                  <button onClick={() => setPrintModalOpen(true)} className="bg-stone-800 text-white hover:bg-stone-900 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-md transition">
                    <i data-lucide="printer" className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span className="hidden sm:inline">รายงานสรุป</span>
                  </button>

                  {lowStockItems.length > 0 && (
                    <button onClick={() => handleTabChange('stock')} className="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold px-2.5 py-2 rounded-xl flex items-center gap-1 animate-pulse">
                      <i data-lucide="bell" className="w-3.5 h-3.5"></i>
                      <span>({lowStockItems.length})</span>
                    </button>
                  )}
                </div>
              </div>

              {/* Navigation Bar */}
              <div className="bg-amber-100/40 p-1.5 border-t border-amber-200/50">
                <div className="max-w-7xl mx-auto flex space-x-1 overflow-x-auto no-scrollbar justify-start sm:justify-center px-2">
                  <button onClick={() => handleTabChange('ordersTab')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap relative ${activeTab === 'ordersTab' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="inbox" className="w-4 h-4"></i>
                    <span>📥 ออเดอร์ลูกค้าสแกน</span>
                    {pendingOrders.length > 0 && (
                      <span className="ml-1 bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold animate-pulse">
                        {pendingOrders.length}
                      </span>
                    )}
                  </button>

                  <button onClick={() => handleTabChange('menuManage')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'menuManage' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="toggle-left" className="w-4 h-4"></i>
                    <span>🍹 เมนูหน้าร้าน & เปิด/ปิดขาย</span>
                  </button>

                  <button onClick={() => handleTabChange('salesSummary')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'salesSummary' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="bar-chart-3" className="w-4 h-4"></i>
                    <span>📊 สรุปยอดขาย</span>
                  </button>

                  <button onClick={() => handleTabChange('stock')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap relative ${activeTab === 'stock' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="boxes" className="w-4 h-4"></i>
                    <span>📦 คลังวัตถุดิบ</span>
                    {lowStockItems.length > 0 && <span className="w-2 h-2 rounded-full bg-rose-500"></span>}
                  </button>

                  <button onClick={() => handleTabChange('bom')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'bom' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="book-open" className="w-4 h-4"></i>
                    <span>📖 สูตรการผลิต & ราคา (BOM)</span>
                  </button>

                  <button onClick={() => handleTabChange('history')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'history' ? 'bg-amber-800 text-white shadow-sm' : 'text-stone-600 hover:text-amber-950'}`}>
                    <i data-lucide="history" className="w-4 h-4"></i>
                    <span>📜 ประวัติบันทึกการขาย</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content Body */}
            <main className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 my-4 sm:my-6">

              {loading ? (
                <div className="text-center py-20 text-amber-900 font-medium text-sm">กำลังโหลดข้อมูลระบบเศรษฐีชา...</div>
              ) : (
                <>
                  {/* TAB 0: ออเดอร์เด้งเข้า Real-time จากลูกค้าสแกน */}
                  {activeTab === 'ordersTab' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="mb-6 pb-4 border-b border-stone-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                            <span>📥</span> รายการออเดอร์เข้าใหม่ (ลูกค้าสแกนสั่ง)
                          </h2>
                          <p className="text-xs text-stone-400 mt-1">ออเดอร์จะเด้งขึ้นมาตรงนี้อัตโนมัติเมื่อลูกค้ากดสั่งผ่าน QR Code หน้าร้าน</p>
                        </div>
                        <span className="bg-amber-100 text-amber-900 font-extrabold text-xs px-3.5 py-1.5 rounded-xl self-start sm:self-auto border border-amber-200">
                          ค้างรับ {pendingOrders.length} ออเดอร์
                        </span>
                      </div>

                      {pendingOrders.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm italic">
                          ยังไม่มีออเดอร์ใหม่เข้ามาขณะนี้
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {pendingOrders.map(order => (
                            <div key={order.id} className="bg-amber-50/50 border-2 border-amber-300 rounded-3xl p-5 shadow-sm space-y-3 relative flex flex-col justify-between">
                              <div>
                                <div className="flex justify-between items-center border-b border-amber-200/80 pb-2.5">
                                  <span className="text-xs text-stone-500 font-bold">{order.datetime}</span>
                                  <span className="bg-amber-200 text-amber-900 text-[10px] font-black px-2.5 py-0.5 rounded-full animate-pulse">
                                    ออเดอร์ใหม่
                                  </span>
                                </div>

                                <div className="space-y-1.5 my-3">
