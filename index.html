                                  {order.items && order.items.map((item, idx) => (
                                    <div key={idx} className="flex justify-between items-center text-xs sm:text-sm font-bold text-amber-950 bg-white p-2.5 rounded-2xl border border-amber-200/60 shadow-sm">
                                      <span>{item.menuName} × {item.qty}</span>
                                      <span className="text-amber-800 font-black">{item.totalPrice} ฿</span>
                                    </div>
                                  ))}
                                </div>

                                {order.note && (
                                  <div className="text-xs text-stone-600 bg-amber-100/70 p-2.5 rounded-2xl border border-amber-200/60 italic">
                                    💬 หมายเหตุ: {order.note}
                                  </div>
                                )}
                              </div>

                              <div className="pt-3 border-t border-amber-200/80 space-y-2.5">
                                <div className="flex justify-between items-center font-black text-amber-950 text-base">
                                  <span className="text-xs text-stone-500 font-bold">ยอดรวมทั้งสิ้น:</span>
                                  <span className="text-amber-900 text-lg">{order.totalPrice.toLocaleString()} บาท</span>
                                </div>
                                <div className="flex gap-2">
                                  <button
                                    onClick={() => handleCancelCustomerOrder(order.id)}
                                    className="flex-1 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs rounded-xl transition"
                                  >
                                    ✕ ยกเลิก
                                  </button>
                                  <button
                                    onClick={() => handleAcceptCustomerOrder(order)}
                                    className="flex-2 py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-bold text-xs rounded-xl shadow-md transition"
                                  >
                                    ✓ รับออเดอร์/คิดเงิน (ตัดสต๊อก)
                                  </button>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB NEW: จัดการเปิด/ปิดการขายเมนูหน้าร้าน */}
                  {activeTab === 'menuManage' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="mb-6 pb-4 border-b border-stone-100">
                        <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                          <span>🍹</span> จัดการรายการเมนู & เปิด/ปิดการขายหน้าร้าน
                        </h2>
                        <p className="text-xs text-stone-400 mt-1">หากวัตถุดิบรายการใดหมด สามารถกดปิดการขายที่นี่เพื่อให้หน้าร้านของลูกค้าแสดงผลทันที</p>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อเมนู..."
                          value={searchMenuManage}
                          onChange={(e) => setSearchMenuManage(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-stone-400 text-xs">🔍</span>
                      </div>

                      {filteredManageRecipes.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm">ไม่พบเมนูเครื่องดื่ม</div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                          {filteredManageRecipes.map(recipe => {
                            const isAvailable = recipe.isAvailable !== false; // default true
                            return (
                              <div key={recipe.id} className={`p-4 rounded-2xl border transition-all duration-200 flex items-center justify-between gap-3 ${isAvailable ? 'bg-white border-amber-100 custom-shadow' : 'bg-stone-50 border-stone-200 opacity-75'}`}>
                                <div className="flex items-center space-x-3 min-w-0">
                                  <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border shrink-0" alt={recipe.name} />
                                  <div className="min-w-0">
                                    <h3 className="font-bold text-amber-950 text-sm truncate">{recipe.name}</h3>
                                    <span className="text-xs font-extrabold text-amber-800">{recipe.price || 35} ฿</span>
                                  </div>
                                </div>

                                <button
                                  onClick={() => handleToggleMenuAvailability(recipe)}
                                  className={`px-3 py-1.5 rounded-xl font-bold text-xs transition flex items-center gap-1.5 shrink-0 ${
                                    isAvailable 
                                      ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 hover:bg-emerald-200' 
                                      : 'bg-rose-100 text-rose-700 border border-rose-300 hover:bg-rose-200'
                                  }`}
                                >
                                  <span className={`w-2 h-2 rounded-full ${isAvailable ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                                  {isAvailable ? 'พร้อมขาย' : 'สินค้าหมด'}
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 2: สรุปยอดขาย */}
                  {activeTab === 'salesSummary' && (
                    <div className="space-y-6">
                      {/* สรุปรายวัน */}
                      <div className="bg-white rounded-3xl p-5 sm:p-8 border border-amber-200/60 custom-shadow">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 pb-4 border-b border-stone-100 mb-4">
                          <div>
                            <h2 className="text-lg font-bold text-amber-950 flex items-center gap-2">
                              <span>📅</span> สรุปยอดขายรายวัน
                            </h2>
                            <p className="text-xs text-stone-400 mt-0.5">เลือกระบุวันที่เพื่อดูสถิติการขายประจำวัน</p>
                          </div>

                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-amber-900 whitespace-nowrap">วันที่:</span>
                            <input
                              type="date"
                              value={selectedDailyDate}
                              onChange={(e) => setSelectedDailyDate(e.target.value)}
                              className="px-3.5 py-2 text-xs sm:text-sm rounded-xl custom-input font-bold"
                            />
                            {selectedDailyDate !== todayISO && (
                              <button
                                onClick={() => setSelectedDailyDate(todayISO)}
                                className="px-3 py-2 bg-amber-100 text-amber-900 hover:bg-amber-200 rounded-xl text-xs font-bold transition whitespace-nowrap"
                              >
                                วันนี้
                              </button>
                            )}
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                          <div className="bg-amber-50 border border-amber-200/80 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-amber-800 block">ยอดขายรวมประจำวัน</span>
                            <span className="text-2xl sm:text-3xl font-black text-amber-700 mt-1 block">
                              {selectedDailySalesSummary.totalMoney.toLocaleString()} <span className="text-xs font-normal">บาท</span>
                            </span>
                          </div>

                          <div className="bg-orange-50 border border-orange-200/80 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-orange-800 block">จำนวนเครื่องดื่มที่ขายได้</span>
                            <span className="text-2xl sm:text-3xl font-black text-orange-700 mt-1 block">
                              {selectedDailySalesSummary.totalCups.toLocaleString()} <span className="text-xs font-normal">แก้ว/หน่วย</span>
                            </span>
                          </div>

                          <div className="bg-stone-50 border border-stone-200 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-stone-700 block">จำนวนออเดอร์ที่ขาย</span>
                            <span className="text-2xl sm:text-3xl font-black text-stone-800 mt-1 block">
                              {selectedDailySalesSummary.count} <span className="text-xs font-normal">รายการ</span>
                            </span>
                          </div>
                        </div>

                        {/* ตารางรายการขายในวันที่ (ทำเป็นปุ่มกดพับเก็บได้) */}
                        <div className="pt-2 border-t border-stone-100">
                          <button
                            onClick={() => setShowDailyLogs(!showDailyLogs)}
                            className="w-full py-2.5 px-4 bg-stone-50 hover:bg-stone-100 border border-stone-200 rounded-xl flex justify-between items-center text-xs font-bold text-amber-950 transition"
                          >
                            <span>📋 รายการขายในวันที่ {selectedDailyDate} ({selectedDailySalesSummary.logs.length} รายการ)</span>
                            <span>{showDailyLogs ? '▲ ซ่อนรายการ' : '▼ แสดงรายการ'}</span>
                          </button>

                          {showDailyLogs && (
                            <div className="mt-3 space-y-2 max-h-[300px] overflow-y-auto pr-1">
                              {selectedDailySalesSummary.logs.length === 0 ? (
                                <div className="text-center py-6 text-stone-400 text-xs italic">ไม่มีข้อมูลการขายในวันที่เลือก</div>
                              ) : (
                                selectedDailySalesSummary.logs.map(log => (
                                  <div key={log.id} className="bg-stone-50 border border-stone-200 p-3 rounded-2xl flex items-center justify-between gap-2 text-xs">
                                    <div>
                                      <span className="font-bold text-amber-950 text-sm block">{log.menuName}</span>
                                      <span className="text-stone-400 text-[11px]">{log.datetime} {log.note ? `• ${log.note}` : ''}</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                      <div className="text-right">
                                        <span className="font-black text-amber-800 text-sm block">+{log.totalAmount} ฿</span>
                                        <span className="text-[10px] text-stone-500">{log.cups} หน่วย @ {log.pricePerCup}฿</span>
                                      </div>
                                      <button onClick={() => handleDeleteSale(log.id)} className="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                      </button>
                                    </div>
                                  </div>
                                ))
                              )}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* สรุปรายเดือน (เอาประวัติออกแล้ว) */}
                      <div className="bg-white rounded-3xl p-5 sm:p-8 border border-amber-200/60 custom-shadow">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 pb-4 border-b border-stone-100 mb-4">
                          <div>
                            <h2 className="text-lg font-bold text-amber-950 flex items-center gap-2">
                              <span>📊</span> สรุปยอดขายรายเดือน
                            </h2>
                            <p className="text-xs text-stone-400 mt-0.5">เลือกเดือนเพื่อดูสถิติยอดขายสะสม</p>
                          </div>

                          <input
                            type="month"
                            value={selectedMonth}
                            onChange={(e) => setSelectedMonth(e.target.value)}
                            className="px-4 py-2 text-sm rounded-xl custom-input font-bold"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div className="bg-[#2b1e16] text-white rounded-2xl p-4 text-center">
                            <span className="text-xs font-semibold text-amber-200/70 block">รายได้สะสมประจำเดือน</span>
                            <span className="text-2xl sm:text-3xl font-black text-amber-400 mt-1 block">
                              {monthSalesSummary.totalMoney.toLocaleString()} <span className="text-xs font-normal text-amber-200">บาท</span>
                            </span>
                          </div>

                          <div className="bg-stone-50 border border-stone-200 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-stone-600 block">จำนวนแก้วรวมประจำเดือน</span>
                            <span className="text-2xl sm:text-3xl font-black text-stone-800 mt-1 block">
                              {monthSalesSummary.totalCups.toLocaleString()} <span className="text-xs font-normal">แก้ว</span>
                            </span>
                          </div>

                          <div className="bg-stone-50 border border-stone-200 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-stone-600 block">ยอดขายเฉลี่ยต่อวัน</span>
                            <span className="text-2xl sm:text-3xl font-black text-amber-800 mt-1 block">
                              {monthSalesSummary.avgDailyMoney.toLocaleString()} <span className="text-xs font-normal">บาท/วัน</span>
                            </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: คลังวัตถุดิบ */}
                  {activeTab === 'stock' && (
                    <div className="bg-white rounded-3xl p-3.5 sm:p-8 border border-amber-200/60 custom-shadow">
                      
                      {lowStockItems.length > 0 && (
                        <div className="mb-5 bg-rose-50 border-2 border-rose-300 rounded-2xl p-3.5 sm:p-5 text-rose-900 shadow-sm">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div className="flex items-center space-x-2 font-bold text-xs sm:text-base text-rose-700">
                              <i data-lucide="alert-triangle" className="w-4 h-4 sm:w-5 sm:h-5 text-rose-600 animate-bounce"></i>
                              <span>เตือนการสั่งซื้อ: วัตถุดิบใกล้หมดคลัง ({lowStockItems.length} รายการ)</span>
                            </div>
                            <button onClick={() => setRestockModalOpen(true)} className="bg-rose-600 text-white font-bold text-xs px-3.5 py-1.5 sm:py-2 rounded-xl hover:bg-rose-700 transition shadow-md w-full sm:w-auto text-center">
                              📥 เติมสต๊อกทันที
                            </button>
                          </div>
                          <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-2">
                            {lowStockItems.map(item => (
                              <div key={item.id} className="bg-white p-2 rounded-xl border border-rose-200 flex items-center justify-between">
                                <div className="flex items-center space-x-1.5 truncate">
                                  <img src={item.image || DEFAULT_IMAGE} className="w-7 h-7 rounded-md object-cover" alt={item.name} />
                                  <span className="font-bold text-[11px] sm:text-xs text-stone-800 truncate">{item.name}</span>
                                </div>
                                <span className="text-[10px] font-bold text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded ml-1 whitespace-nowrap">
                                  {item.current} {item.unit}
                                </span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4 pb-4 border-b border-stone-100">
                        <div>
                          <h2 className="text-base sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                            <span>📦</span> คลังวัตถุดิบคงเหลือ
                          </h2>
                          <p className="text-[11px] sm:text-xs text-stone-400 mt-0.5">จัดการสต๊อกชา นม ไข่มุก ไซรัป บรรจุภัณฑ์</p>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-2">
                          <button onClick={() => setStockCategorySummaryModalOpen(true)} className="btn-pill bg-amber-800 hover:bg-amber-900 text-xs px-3.5 py-2 active:scale-95 shadow-md flex-1 sm:flex-none">
                            <i data-lucide="clipboard-list" className="w-3.5 h-3.5"></i> สรุปตามหมวดหมู่
                          </button>

                          <button onClick={() => setRestockModalOpen(true)} className="btn-pill btn-boba text-xs px-3.5 py-2 active:scale-95 flex-1 sm:flex-none">
                            <i data-lucide="plus-circle" className="w-3.5 h-3.5"></i> เติมสต๊อก
                          </button>

                          <button onClick={() => { setEditingStock(null); setStockModalOpen(true); }} className="btn-pill btn-dark-boba text-xs px-3.5 py-2 active:scale-95 flex-1 sm:flex-none">
                            <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มวัตถุดิบ
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-col sm:flex-row gap-2.5 mb-5">
                        <div className="flex-1 relative">
                          <input
                            type="text"
                            placeholder="ค้นหาชื่อวัตถุดิบในคลัง..."
                            value={searchStock}
                            onChange={(e) => setSearchStock(e.target.value)}
                            className="w-full px-3.5 py-2.5 text-xs sm:text-sm rounded-xl custom-input pl-9"
                          />
                          <span className="absolute left-3 top-3 text-stone-400 text-xs">🔍</span>
                          {searchStock && (
                            <button onClick={() => setSearchStock('')} className="absolute right-3 top-2.5 text-stone-400 text-xs hover:text-stone-600 font-bold">✕</button>
                          )}
                        </div>

                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                          <button
                            onClick={() => setSelectedCategory('all')}
                            className={`px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                              selectedCategory === 'all'
                                ? 'bg-amber-900 text-white shadow-sm'
                                : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                            }`}
                          >
                            ทั้งหมด
                          </button>
                          {categories.map((cat) => (
                            <button
                              key={cat.id}
                              onClick={() => setSelectedCategory(cat.name)}
                              className={`px-3 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                                selectedCategory === cat.name
                                  ? 'bg-amber-900 text-white shadow-sm'
                                  : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                              }`}
                            >
                              {cat.name}
                            </button>
                          ))}
                          <button
                            onClick={() => setCategoryModalOpen(true)}
                            className="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-bold transition"
                            title="จัดการหมวดหมู่"
                          >
                            ⚙️
                          </button>
                        </div>
                      </div>

                      {filteredStocks.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm">ไม่พบวัตถุดิบตรงตามเงื่อนไข</div>
                      ) : (
                        <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4">
                          {filteredStocks.map(s => {
                            const isLow = Number(s.current) <= Number(s.minAlert || 0);
                            return (
                              <div key={s.id} className={`p-3 sm:p-4 rounded-2xl border transition-all duration-200 flex flex-col justify-between relative ${isLow ? 'bg-rose-50/40 border-rose-200 shadow-sm' : 'bg-white border-amber-100 hover:border-amber-300 shadow-sm'}`}>
                                <div>
                                  <div className="flex items-center space-x-2.5 mb-2.5">
                                    <img src={s.image || DEFAULT_IMAGE} className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl object-cover border border-stone-200 shrink-0" alt={s.name} />
                                    <div className="min-w-0 flex-1">
                                      <h3 className="font-bold text-xs sm:text-sm text-amber-950 truncate" title={s.name}>{s.name}</h3>
                                      <span className="inline-block text-[9px] sm:text-[10px] bg-amber-50 text-amber-800 border border-amber-200/60 font-medium px-2 py-0.5 rounded-full mt-0.5 truncate max-w-full">
                                        {s.category || 'ทั่วไป'}
                                      </span>
                                    </div>
                                  </div>

                                  <div className="my-2 bg-stone-50 p-2 rounded-xl border border-stone-100 text-center">
                                    <div className={`font-black text-base sm:text-xl ${isLow ? 'text-rose-600' : 'text-amber-950'}`}>
                                      {s.current} <span className="text-[10px] sm:text-xs font-normal text-stone-400">{s.unit}</span>
                                    </div>
                                    {isLow && (
                                      <span className="text-[9px] font-bold text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded-md inline-block mt-1">
                                        ⚠️ ใกล้หมด (Min: {s.minAlert})
                                      </span>
                                    )}
                                  </div>
                                </div>

                                <div className="flex items-center justify-end gap-1 pt-2 border-t border-stone-100 mt-1">
                                  <button
                                    onClick={() => { setEditingStock(s); setStockModalOpen(true); }}
                                    className="p-1.5 text-stone-400 hover:text-amber-800 hover:bg-amber-50 rounded-lg transition"
                                    title="แก้ไขข้อมูล"
                                  >
                                    <i data-lucide="edit-3" className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                                  </button>
                                  <button
                                    onClick={() => handleDeleteStock(s.id)}
                                    className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                    title="ลบวัตถุดิบ"
                                  >
                                    <i data-lucide="trash-2" className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 4: สูตรการผลิต (BOM) */}
                  {activeTab === 'bom' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6 pb-4 border-b border-stone-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                            <span>📖</span> จัดการสูตรการผลิต & ราคาขาย (BOM)
                          </h2>
                          <p className="text-xs text-stone-400 mt-1">ตั้งค่าส่วนผสมและกำหนดราคาขายต่อแก้ว เพื่อให้ระบบตัดสต๊อกอัตโนมัติเมื่อลูกค้ารับออเดอร์</p>
                        </div>
                        <button
                          onClick={() => { setEditingRecipe(null); setRecipeModalOpen(true); }}
                          className="btn-pill btn-dark-boba text-xs px-4 py-2.5 active:scale-95"
                        >
                          <i data-lucide="plus" className="w-4 h-4"></i> เพิ่มสูตร & ราคาใหม่
                        </button>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อสูตร / เมนู..."
                          value={searchRecipe}
                          onChange={(e) => setSearchRecipe(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-stone-400 text-xs">🔍</span>
                      </div>

                      {filteredRecipes.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm">ยังไม่มีสูตรเครื่องดื่มในระบบ กดเพิ่มสูตรได้เลย</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {filteredRecipes.map(recipe => (
                            <div key={recipe.id} className="bg-amber-50/30 border border-amber-200/60 rounded-2xl p-4 flex flex-col justify-between">
                              <div>
                                <div className="flex items-center justify-between border-b border-amber-200/50 pb-3 mb-3">
                                  <div className="flex items-center space-x-3">
                                    <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border" alt={recipe.name} />
                                    <div>
                                      <h3 className="font-bold text-amber-950 text-sm sm:text-base">{recipe.name}</h3>
                                      <div className="flex items-center gap-2 mt-0.5">
                                        <span className="text-xs font-black text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">
                                          ราคา {recipe.price || 35} ฿
                                        </span>
                                        <span className="text-[11px] text-stone-400">
                                          ต่อ {recipe.yieldInfo || 'แก้ว'}
                                        </span>
                                      </div>
                                    </div>
                                  </div>
                                  <div className="flex items-center space-x-1">
                                    <button
                                      onClick={() => { setEditingRecipe(recipe); setRecipeModalOpen(true); }}
                                      className="p-1.5 text-stone-400 hover:text-amber-800 hover:bg-white rounded-lg transition"
                                    >
                                      <i data-lucide="edit-3" className="w-4 h-4"></i>
                                    </button>
                                    <button
                                      onClick={() => handleDeleteRecipe(recipe.id)}
                                      className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-white rounded-lg transition"
                                    >
                                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                  </div>
                                </div>

                                <div className="space-y-1.5">
                                  <span className="text-[11px] font-bold text-stone-500 uppercase tracking-wider">ส่วนผสมที่ใช้:</span>
                                  <div className="grid grid-cols-2 gap-1.5">
                                    {recipe.ingredients && recipe.ingredients.map((ing, idx) => {
                                      const stockItem = stocks.find(s => s.id === ing.stockId);
                                      return (
                                        <div key={idx} className="bg-white px-2.5 py-1.5 rounded-lg border border-stone-200 flex justify-between items-center text-xs">
                                          <span className="font-medium text-stone-700 truncate">{stockItem ? stockItem.name : 'วัตถุดิบ'}</span>
                                          <span className="font-bold text-amber-800 ml-1 whitespace-nowrap">{ing.amount} {ing.unit || stockItem?.unit}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 5: ประวัติบันทึกการขาย */}
                  {activeTab === 'history' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="mb-6 pb-4 border-b border-stone-100">
                        <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                          <span>📜</span> ประวัติบันทึกการขาย
                        </h2>
                        <p className="text-xs text-stone-400 mt-1">ตรวจสอบประวัติการรับออเดอร์ ยอดตัดสต๊อก หรือแก้ไข/ลบรายการที่บันทึกผิด</p>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาประวัติ..."
                          value={searchHistory}
                          onChange={(e) => setSearchHistory(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-stone-400 text-xs">🔍</span>
                      </div>

                      {filteredLogs.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm">ยังไม่มีประวัติการขาย</div>
                      ) : (
                        <div className="space-y-3">
                          {filteredLogs.map(log => {
                            const isShowDetails = unlockedLogDetails[log.id];
                            return (
                              <div key={log.id} className="bg-amber-50/30 border border-amber-200/50 p-4 rounded-2xl flex flex-col justify-between gap-3">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-stone-200/60 pb-2.5">
                                  <div>
                                    <div className="flex items-center gap-2">
                                      <span className="bg-amber-800 text-amber-100 text-[10px] font-bold px-2 py-0.5 rounded-md">
                                        {log.type || 'สั่งซื้อ/ขาย'}
                                      </span>
                                      <span className="text-[11px] text-stone-400 font-medium">{log.datetime}</span>
                                    </div>
                                    <h3 className="font-bold text-sm sm:text-base text-amber-950 mt-1">{log.title}</h3>
                                    {log.totalAmount && <p className="text-xs font-bold text-amber-700 mt-0.5">ยอดรวมเงิน: {log.totalAmount.toLocaleString()} บาท</p>}
                                    {log.note && <p className="text-xs text-stone-500 italic mt-0.5">หมายเหตุ: {log.note}</p>}
                                  </div>

                                  <div className="flex items-center gap-2 self-end sm:self-center">
                                    <button
                                      onClick={() => setProductionToEdit(log)}
                                      className="text-xs font-bold text-amber-800 bg-amber-100/60 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-xl transition flex items-center gap-1"
                                    >
                                      <i data-lucide="edit-3" className="w-3.5 h-3.5"></i> แก้ไข
                                    </button>
                                    <button
                                      onClick={() => setLogToDelete(log)}
                                      className="text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-1.5 rounded-xl transition flex items-center gap-1"
                                    >
                                      <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> ลบ
                                    </button>
                                  </div>
                                </div>

                                <div>
                                  <div className="flex justify-between items-center">
                                    <button
                                      onClick={() => handleToggleShowDetails(log.id)}
                                      className="text-xs font-bold text-amber-800 hover:underline flex items-center gap-1"
                                    >
                                      <i data-lucide={isShowDetails ? "eye-off" : "eye"} className="w-3.5 h-3.5"></i>
                                      {isShowDetails ? 'ซ่อนส่วนผสมที่ถูกตัด' : '🔒 ใส่รหัสเพื่อดูวัตถุดิบที่ตัดสต๊อก'}
                                    </button>
                                  </div>

                                  {isShowDetails && log.details && (
                                    <div className="mt-2.5 pt-2.5 border-t border-stone-200 grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                                      {log.details.map((d, idx) => (
                                        <div key={idx} className="bg-white px-2.5 py-1.5 rounded-lg border border-stone-200 text-[11px] font-medium text-stone-700">
                                          {d}
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          {/* Footer */}
          <footer className="bg-white border-t border-amber-200/60 py-4 text-center text-xs text-amber-900/50 mt-8">
            <p>© {new Date().getFullYear()} ระบบสต๊อก & คิดเงิน - เศรษฐีชา</p>
          </footer>

          {/* ALL MODALS */}
          <CategoryModal
            isOpen={categoryModalOpen}
            onClose={() => setCategoryModalOpen(false)}
            categories={categories}
            onAddCategory={handleAddCategory}
            onDeleteCategory={handleDeleteCategory}
          />

          <StockSummaryByCategoryModal
            isOpen={stockCategorySummaryModalOpen}
            onClose={() => setStockCategorySummaryModalOpen(false)}
            stocks={stocks}
            categories={categories}
          />

          <StockModal
            isOpen={stockModalOpen}
            onClose={() => setStockModalOpen(false)}
            onSave={handleSaveStock}
            editingStock={editingStock}
            handleImageUpload={handleImageUpload}
            categories={categories}
            onOpenCategoryModal={() => { setStockModalOpen(false); setCategoryModalOpen(true); }}
          />

          <RestockModal
            isOpen={restockModalOpen}
            onClose={() => setRestockModalOpen(false)}
            stocks={stocks}
            categories={categories}
            onConfirmBatchRestock={handleBatchRestock}
          />

          <RecipeModal
            isOpen={recipeModalOpen}
            onClose={() => setRecipeModalOpen(false)}
            onSave={handleSaveRecipe}
            editingRecipe={editingRecipe}
            stocks={stocks}
            handleImageUpload={handleImageUpload}
          />

          <EditProductionLogModal
            isOpen={!!productionToEdit}
            onClose={() => setProductionToEdit(null)}
            logToEdit={productionToEdit}
            onSave={handleSaveProductionEdit}
          />

          <DeleteLogModal
            isOpen={!!logToDelete}
            onClose={() => setLogToDelete(null)}
            logToDelete={logToDelete}
            onConfirmDelete={handleConfirmDeleteLog}
          />

          <PrintSummaryModal
            isOpen={printModalOpen}
            onClose={() => setPrintModalOpen(false)}
            logs={logs}
            lowStockItems={lowStockItems}
          />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
