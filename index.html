<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบสต๊อก & หลังร้าน - ชานมกลมกล่อม</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #f7f3ee;
      color: #3d2b1f; 
      -webkit-tap-highlight-color: transparent; 
    }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(61, 43, 31, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-input {
      background-color: #fffdfa;
      border: 1.5px solid #e2d7cd;
      color: #3d2b1f;
      transition: all 0.2s ease-in-out;
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #c08552;
      box-shadow: 0 0 0 3px rgba(192, 133, 82, 0.2);
      outline: none;
    }

    input, select, button { touch-action: manipulation; }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      color: #ffffff;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    .btn-boba {
      background-color: #8c5a3c;
      box-shadow: 0 4px 14px rgba(140, 90, 60, 0.3);
    }
    .btn-boba:hover { background-color: #6f442b; }

    .btn-dark-boba {
      background-color: #2b1e16;
      box-shadow: 0 4px 14px rgba(43, 30, 22, 0.3);
    }
    .btn-dark-boba:hover { background-color: #1a120d; }

    .a4-container {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report {
        position: absolute; left: 0; top: 0; width: 100% !important;
        height: auto !important; box-shadow: none !important; border: none !important; padding: 0 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="selection:bg-amber-700 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MASTER_PASSWORD = "Phon1234";

    const firebaseConfig = {
      apiKey: "AIzaSyDCwQ4AIxY5haYIj-Kd-nGNAq_Jn1t_aLk",
      authDomain: "chanomstock.firebaseapp.com",
      projectId: "chanomstock",
      storageBucket: "chanomstock.firebasestorage.app",
      messagingSenderId: "309865099169",
      appId: "1:309865099169:web:d5df7c674180ab845865e0",
      measurementId: "G-Y6HGEXEQWY"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=150';

    const convertUnitToStock = (amount, recipeUnit, stockUnit) => {
      const rUnit = (recipeUnit || '').toLowerCase().trim();
      const sUnit = (stockUnit || '').toLowerCase().trim();
      if (rUnit === sUnit) return amount;
      if ((rUnit === 'กรัม' || rUnit === 'g') && (sUnit === 'กิโลกรัม' || sUnit === 'kg')) return amount / 1000;
      if ((rUnit === 'กิโลกรัม' || rUnit === 'kg') && (sUnit === 'กรัม' || sUnit === 'g')) return amount * 1000;
      if ((rUnit === 'มล.' || rUnit === 'ml') && (sUnit === 'ลิตร' || sUnit === 'l')) return amount / 1000;
      if ((rUnit === 'ลิตร' || rUnit === 'l') && (sUnit === 'มล.' || sUnit === 'ml')) return amount * 1000;
      return amount;
    };

    // MODAL: จัดการหมวดหมู่
    function CategoryModal({ isOpen, onClose, categories, onAddCategory, onDeleteCategory }) {
      const [newCatName, setNewCatName] = useState('');
      if (!isOpen) return null;

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        onAddCategory(newCatName.trim());
        setNewCatName('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 max-h-[85vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-3 border-b border-stone-100 mb-4">
                <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide="tag" className="w-5 h-5 text-amber-700"></i> จัดการหมวดหมู่สินค้า
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form onSubmit={handleAdd} className="flex gap-2 mb-4">
                <input
                  type="text"
                  placeholder="เพิ่มหมวดหมู่ใหม่..."
                  value={newCatName}
                  onChange={(e) => setNewCatName(e.target.value)}
                  className="flex-1 px-3 py-2 text-xs sm:text-sm rounded-xl custom-input"
                />
                <button type="submit" className="bg-amber-700 hover:bg-amber-800 text-white font-bold text-xs px-4 py-2 rounded-xl transition">
                  + เพิ่ม
                </button>
              </form>

              <div className="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
                {categories.map(cat => (
                  <div key={cat.id} className="bg-amber-50/50 border border-amber-200/60 px-3 py-2 rounded-xl flex justify-between items-center text-xs font-semibold text-amber-950">
                    <span>{cat.name}</span>
                    <button onClick={() => onDeleteCategory(cat.id)} className="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50">
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>

            <div className="pt-4 border-t border-stone-100 mt-4 text-right">
              <button onClick={onClose} className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition">
                ปิด
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: สรุปวัตถุดิบคงเหลือตามหมวดหมู่
    function StockSummaryByCategoryModal({ isOpen, onClose, stocks, categories }) {
      if (!isOpen) return null;

      const categorizedStocks = categories.map(cat => ({
        categoryName: cat.name,
        items: stocks.filter(s => s.category === cat.name)
      }));

      const todayStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-stone-900/70 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-2xl max-w-md w-full p-4 sm:p-6 shadow-2xl border border-stone-100 h-[92vh] flex flex-col justify-between">
            <div className="flex justify-between items-center pb-2.5 border-b border-stone-200">
              <div>
                <h3 className="font-bold text-base sm:text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide="clipboard-check" className="w-5 h-5 text-amber-700"></i> สรุปสต๊อกตามหมวดหมู่
                </h3>
                <p className="text-[10px] text-stone-400">ร้านชานมกลมกล่อม | ประจำวันที่ {todayStr}</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto py-3 space-y-3 no-scrollbar my-1">
              {categorizedStocks.map(catGroup => {
                if (catGroup.items.length === 0) return null;
                return (
                  <div key={catGroup.categoryName} className="bg-amber-50/40 border border-amber-200/60 rounded-xl p-2.5">
                    <div className="font-bold text-xs text-amber-800 border-b border-amber-200/40 pb-1 mb-1.5 flex justify-between">
                      <span>🏷️ {catGroup.categoryName}</span>
                      <span className="text-[10px] text-stone-400 font-normal">({catGroup.items.length} รายการ)</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5">
                      {catGroup.items.map(item => (
                        <div key={item.id} className="bg-white px-2 py-1.5 rounded-lg border border-stone-200 flex items-center justify-between text-[11px]">
                          <span className="font-medium text-stone-800 truncate pr-1">{item.name}</span>
                          <span className="font-bold text-stone-700 whitespace-nowrap">{item.current} {item.unit}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="pt-2.5 border-t border-stone-100">
              <button onClick={onClose} className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs rounded-xl transition">
                ปิด
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: เพิ่ม/แก้ไข วัตถุดิบ
    function StockModal({ isOpen, onClose, onSave, editingStock, handleImageUpload, categories, onOpenCategoryModal }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('');
      const [current, setCurrent] = useState('');
      const [unit, setUnit] = useState('ถัง');
      const [minAlert, setMinAlert] = useState('5');
      const [image, setImage] = useState('');

      useEffect(() => {
        const defaultCat = categories.length > 0 ? categories[0].name : 'ทั่วไป';
        if (editingStock) {
          setName(editingStock.name || '');
          setCategory(editingStock.category || defaultCat);
          setCurrent(editingStock.current !== undefined ? editingStock.current : '');
          setUnit(editingStock.unit || 'ถัง');
          setMinAlert(editingStock.minAlert !== undefined ? editingStock.minAlert : '5');
          setImage(editingStock.image || '');
        } else {
          setName(''); setCategory(defaultCat); setCurrent(''); setUnit('ถัง'); setMinAlert('5'); setImage('');
        }
      }, [editingStock, isOpen, categories]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || current === '') return alert('กรุณากรอกชื่อวัตถุดิบและจำนวนคงเหลือ');
        onSave({ id: editingStock ? editingStock.id : undefined, name, category, current: Number(current), unit, minAlert: Number(minAlert), image });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-5">
              <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                <i data-lucide={editingStock ? "edit-3" : "plus-circle"} className="w-5 h-5 text-amber-700"></i>
                {editingStock ? 'แก้ไขรายการวัตถุดิบ' : 'เพิ่มวัตถุดิบใหม่เข้าระบบ'}
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">ชื่อวัตถุดิบ *</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="block text-xs font-semibold text-stone-600">หมวดหมู่</label>
                  <button type="button" onClick={onOpenCategoryModal} className="text-[11px] text-amber-700 font-bold hover:underline">⚙️ จัดการหมวดหมู่</button>
                </div>
                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-3 text-sm rounded-xl custom-input">
                  {categories.map((cat) => <option key={cat.id} value={cat.name}>{cat.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">หน่วยเรียกหลัก *</label>
                <input type="text" value={unit} onChange={e => setUnit(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">จำนวนปัจจุบัน *</label>
                  <input type="number" step="any" value={current} onChange={e => setCurrent(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">จุดเตือนสั่งเพิ่ม</label>
                  <input type="number" step="any" value={minAlert} onChange={e => setMinAlert(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-600 mb-1">รูปภาพ</label>
                <div className="flex items-center space-x-3">
                  <img src={image || DEFAULT_IMAGE} className="w-14 h-14 rounded-xl object-cover border" alt="พรีวิว" />
                  <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} className="text-xs text-stone-500" />
                </div>
              </div>

              <div className="pt-4 flex gap-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-600 font-bold text-sm rounded-xl">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-amber-700 text-white font-bold text-sm rounded-xl">บันทึกข้อมูล</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL: เติมวัตถุดิบ
    function RestockModal({ isOpen, onClose, stocks, categories, onConfirmBatchRestock }) {
      const [restockQtyMap, setRestockQtyMap] = useState({});
      const [note, setNote] = useState('');

      useEffect(() => {
        if (isOpen) {
          const initialMap = {};
          stocks.forEach(s => { initialMap[s.id] = ''; });
          setRestockQtyMap(initialMap); setNote('');
        }
      }, [isOpen, stocks]);

      if (!isOpen) return null;

      const handleQtyChange = (stockId, val) => {
        setRestockQtyMap(prev => ({ ...prev, [stockId]: val }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirmBatchRestock(restockQtyMap, note);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-3">
                <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide="plus-circle" className="w-5 h-5 text-amber-700"></i> 📥 เติมวัตถุดิบเข้าคลัง
                </h3>
                <button onClick={onClose} className="p-1 text-stone-400 hover:text-stone-600"><i data-lucide="x" className="w-5 h-5"></i></button>
              </div>

              <form id="restockForm" onSubmit={handleSubmit} className="space-y-4">
                <div className="max-h-[45vh] overflow-y-auto pr-1 space-y-3">
                  {stocks.map(stock => (
                    <div key={stock.id} className="p-3.5 rounded-2xl border border-amber-200/50 bg-amber-50/20 flex items-center justify-between gap-3">
                      <div className="flex-1 min-w-0 flex items-center gap-3">
                        <img src={stock.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-lg object-cover border" alt={stock.name} />
                        <div>
                          <div className="font-bold text-sm text-amber-950 truncate">{stock.name}</div>
                          <span className="text-xs text-stone-400">ปัจจุบัน: <strong>{stock.current}</strong> {stock.unit}</span>
                        </div>
                      </div>
                      <div className="w-36 flex items-center space-x-1.5">
                        <span className="text-xs font-bold text-amber-700">+</span>
                        <input
                          type="number"
                          step="any"
                          placeholder="0"
                          value={restockQtyMap[stock.id] || ''}
                          onChange={(e) => handleQtyChange(stock.id, e.target.value)}
                          className="w-full px-3 py-2 text-sm text-center font-bold text-amber-800 bg-white rounded-xl border focus:outline-none"
                        />
                        <span className="text-xs text-stone-400 whitespace-nowrap min-w-[30px]">{stock.unit}</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-2">
                  <label className="block text-xs font-semibold text-stone-600 mb-1">หมายเหตุ</label>
                  <input type="text" placeholder="เช่น เติมวัตถุดิบประจำวัน..." value={note} onChange={(e) => setNote(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-stone-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-600 font-bold text-sm rounded-xl">ยกเลิก</button>
              <button type="submit" form="restockForm" className="flex-1 py-3 bg-amber-700 text-white font-bold text-sm rounded-xl shadow-lg">บันทึกการเติมสต๊อก</button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: ยืนยันการลบประวัติ (พร้อมลบยอดขาย)
    function DeleteLogModal({ isOpen, onClose, logToDelete, onConfirmDelete }) {
      if (!isOpen || !logToDelete) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-100 text-center">
            <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <i data-lucide="alert-circle" className="w-6 h-6"></i>
            </div>
            <h3 className="font-bold text-base text-stone-800 mb-1">ยืนยันการลบประวัติรายการ</h3>
            <p className="text-xs text-stone-500 mb-2 font-medium">"{logToDelete.title}"</p>
            <p className="text-xs text-rose-600 font-bold mb-4">⚠️ การลบจะทำการลบยอดขายของออเดอร์นี้ออกจากระบบด้วย</p>

            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-left mb-5">
              <p className="text-xs text-amber-900 font-semibold mb-1">คุณต้องการปรับคืนค่าสต๊อกวัตถุดิบเดิมหรือไม่?</p>
              <p className="text-[11px] text-amber-800/80">
                • <b>คืนค่าสต๊อก:</b> ดึงวัตถุดิบที่ถูกตัดไปคืนกลับเข้าคลัง + ลบยอดขาย<br/>
                • <b>ไม่คืนค่าสต๊อก:</b> ลบประวัติและยอดขายออกเฉยๆ (ไม่คืนสต๊อก)
              </p>
            </div>

            <div className="flex flex-col gap-2">
              <button onClick={() => onConfirmDelete(true)} className="w-full py-3 bg-amber-800 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md">
                🔄 คืนค่าสต๊อกเดิม & ลบยอดขาย/ประวัติ
              </button>
              <button onClick={() => onConfirmDelete(false)} className="w-full py-3 bg-rose-500 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md">
                🗑️ ลบเฉพาะยอดขาย & ประวัติ (ไม่คืนสต๊อก)
              </button>
              <button onClick={onClose} className="w-full py-2.5 bg-stone-100 text-stone-600 font-bold text-xs rounded-xl mt-1">
                ยกเลิก
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL: เพิ่ม/แก้ไข สูตร BOM
    function RecipeModal({ isOpen, onClose, onSave, editingRecipe, stocks, handleImageUpload }) {
      const [name, setName] = useState('');
      const [yieldInfo, setYieldInfo] = useState('1 ถัง');
      const [price, setPrice] = useState(35);
      const [image, setImage] = useState('');
      const [ingredients, setIngredients] = useState([]);

      useEffect(() => {
        if (editingRecipe) {
          setName(editingRecipe.name || '');
          setYieldInfo(editingRecipe.yieldInfo || '1 ถัง');
          setPrice(editingRecipe.price !== undefined ? editingRecipe.price : 35);
          setImage(editingRecipe.image || '');
          setIngredients(editingRecipe.ingredients || []);
        } else {
          setName(''); setYieldInfo('1 ถัง'); setPrice(35); setImage(''); setIngredients([]);
        }
      }, [editingRecipe, isOpen]);

      if (!isOpen) return null;

      const handleAddIngredient = () => {
        if (stocks.length === 0) return alert('กรุณาเพิ่มวัตถุดิบในคลังก่อนสร้างสูตร');
        const defaultStock = stocks[0];
        setIngredients(prev => [...prev, { stockId: defaultStock.id, amount: '', unit: defaultStock.unit || 'กรัม' }]);
      };

      const handleRemoveIngredient = (index) => {
        setIngredients(prev => prev.filter((_, i) => i !== index));
      };

      const handleIngredientChange = (index, field, value) => {
        setIngredients(prev => {
          const updated = [...prev];
          if (field === 'stockId') {
            const selectedStock = stocks.find(s => s.id === value);
            updated[index] = { ...updated[index], stockId: value, unit: selectedStock ? selectedStock.unit : 'กรัม' };
          } else {
            updated[index] = { ...updated[index], [field]: value };
          }
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) return alert('กรุณาระบุชื่อสูตร/เมนู');
        if (ingredients.length === 0) return alert('กรุณาเพิ่มส่วนผสมอย่างน้อย 1 รายการ');

        onSave({
          id: editingRecipe ? editingRecipe.id : undefined,
          name, yieldInfo, price: Number(price), image,
          ingredients: ingredients.map(i => ({ stockId: i.stockId, amount: Number(i.amount), unit: i.unit || 'กรัม' }))
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-stone-100 max-h-[90vh] flex flex-col justify-between">
            <div className="overflow-y-auto pr-1">
              <div className="flex justify-between items-center pb-4 border-b border-stone-100 mb-5">
                <h3 className="font-bold text-lg text-amber-900 flex items-center gap-2">
                  <i data-lucide={editingRecipe ? "edit-3" : "book-open"} className="w-5 h-5 text-amber-700"></i>
                  {editingRecipe ? 'แก้ไขสูตร & ราคาขาย' : 'เพิ่มสูตรเมนูใหม่ (BOM)'}
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-stone-400 hover:text-stone-600 transition"><i data-lucide="x" className="w-5 h-5"></i></button>
              </div>

              <form id="recipeForm" onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">ชื่อสูตร / เมนูเครื่องดื่ม *</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-stone-600 mb-1">ราคาขายต่อหน่วย (บาท) *</label>
                    <input type="number" min="0" value={price} onChange={e => setPrice(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input font-bold text-amber-800" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-stone-600 mb-1">ปริมาณเรียกผลิต</label>
                    <input type="text" value={yieldInfo} onChange={e => setYieldInfo(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-stone-600 mb-1">รูปภาพ</label>
                  <div className="flex items-center space-x-3">
                    <img src={image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border" alt="พรีวิว" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} className="text-xs text-stone-500" />
                  </div>
                </div>

                <div className="pt-2 border-t border-stone-100">
                  <div className="flex justify-between items-center mb-3">
                    <label className="text-xs font-bold text-stone-700">ส่วนผสมที่ใช้ *</label>
                    <button type="button" onClick={handleAddIngredient} className="text-xs font-bold text-amber-800 bg-amber-100/60 px-3 py-1.5 rounded-lg">+ เพิ่มวัตถุดิบ</button>
                  </div>

                  <div className="space-y-3">
                    {ingredients.map((ing, idx) => (
                      <div key={idx} className="flex items-center space-x-2 bg-stone-50 p-2.5 rounded-xl border">
                        <select value={ing.stockId} onChange={(e) => handleIngredientChange(idx, 'stockId', e.target.value)} className="flex-1 px-2.5 py-2 text-xs rounded-lg custom-input font-medium">
                          {stocks.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                        <input type="number" step="any" placeholder="จำนวน" value={ing.amount} onChange={(e) => handleIngredientChange(idx, 'amount', e.target.value)} className="w-20 px-2 py-2 text-xs rounded-lg custom-input text-center font-bold" />
                        <input type="text" placeholder="หน่วย" value={ing.unit || ''} onChange={(e) => handleIngredientChange(idx, 'unit', e.target.value)} className="w-16 px-2 py-2 text-xs rounded-lg custom-input text-center" />
                        <button type="button" onClick={() => handleRemoveIngredient(idx)} className="p-1.5 text-stone-400 hover:text-rose-600"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                      </div>
                    ))}
                  </div>
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-stone-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-600 font-bold text-sm rounded-xl">ยกเลิก</button>
              <button type="submit" form="recipeForm" className="flex-1 py-3 bg-amber-700 text-white font-bold text-sm rounded-xl shadow-lg">บันทึกสูตร & ราคา</button>
            </div>
          </div>
        </div>
      );
    }

    // MAIN APP COMPONENT
    function App() {
      const [activeTab, setActiveTab] = useState('ordersTab');
      const [isBomUnlocked, setIsBomUnlocked] = useState(false);

      const [stocks, setStocks] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [logs, setLogs] = useState([]);
      const [salesLogs, setSalesLogs] = useState([]);
      const [categories, setCategories] = useState([]);
      const [pendingOrders, setPendingOrders] = useState([]);
      const [loading, setLoading] = useState(true);

      const [searchProduction, setSearchProduction] = useState('');
      const [searchStock, setSearchStock] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchRecipe, setSearchRecipe] = useState('');
      const [searchHistory, setSearchHistory] = useState('');

      const [selectedDailyDate, setSelectedDailyDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
      });

      const [selectedMonth, setSelectedMonth] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2, '0')}`;
      });

      const [batchQuantities, setBatchQuantities] = useState({});
      const [productionNote, setProductionNote] = useState('');

      const [unlockedLogDetails, setUnlockedLogDetails] = useState({});

      const [stockModalOpen, setStockModalOpen] = useState(false);
      const [editingStock, setEditingStock] = useState(null);
      const [restockModalOpen, setRestockModalOpen] = useState(false);
      const [printModalOpen, setPrintModalOpen] = useState(false);
      const [recipeModalOpen, setRecipeModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [categoryModalOpen, setCategoryModalOpen] = useState(false);
      const [stockCategorySummaryModalOpen, setStockCategorySummaryModalOpen] = useState(false);

      const [logToDelete, setLogToDelete] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Firebase Real-time Listeners
      useEffect(() => {
        const unsubCategories = db.collection('categories').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCategories(data);
        });

        const unsubStocks = db.collection('stocks').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setStocks(data);
          setLoading(false);
        });

        const unsubRecipes = db.collection('recipes').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRecipes(data);
        });

        const unsubLogs = db.collection('logs').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return { id: doc.id, ...docData, createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now() };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setLogs(data);
        });

        const unsubSales = db.collection('sales').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return { id: doc.id, ...docData, createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now() };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setSalesLogs(data);
        });

        // ดึงข้อมูลออเดอร์ใหม่ Real-time
        const unsubOrders = db.collection('orders').where('status', '==', 'pending').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return { id: doc.id, ...docData, createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now() };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setPendingOrders(data);
        });

        return () => {
          unsubCategories(); unsubStocks(); unsubRecipes(); unsubLogs(); unsubSales(); unsubOrders();
        };
      }, []);

      const handleTabChange = (tabName) => {
        if (tabName === 'bom' && !isBomUnlocked) {
          const pass = prompt('🔐 กรุณากรอกรหัสผ่านเพื่อเข้าถึง "สูตรการผลิต (BOM)":');
          if (pass === MASTER_PASSWORD) {
            setIsBomUnlocked(true); setActiveTab('bom');
          } else if (pass !== null) alert('❌ รหัสผ่านไม่ถูกต้อง');
        } else {
          setActiveTab(tabName);
        }
      };

      // ยืนยันรับออเดอร์จากลูกค้า -> ตัดสต๊อก + คิดเงิน
      const handleAcceptCustomerOrder = async (order) => {
        try {
          const batch = db.batch();
          const deductionsSummary = {};

          order.items.forEach(item => {
            const recipe = recipes.find(r => r.id === item.recipeId || r.name === item.menuName);
            if (recipe && recipe.ingredients) {
              recipe.ingredients.forEach(ing => {
                const stockItem = stocks.find(s => s.id === ing.stockId);
                if (stockItem) {
                  const rawAmount = Number(ing.amount) * item.qty;
                  const convertedAmount = convertUnitToStock(rawAmount, ing.unit, stockItem.unit);
                  deductionsSummary[ing.stockId] = (deductionsSummary[ing.stockId] || 0) + convertedAmount;
                }
              });
            }
          });

          // ตัดสต๊อก
          Object.entries(deductionsSummary).forEach(([stockId, deductAmount]) => {
            const stockRef = db.collection('stocks').doc(stockId);
            batch.update(stockRef, { current: firebase.firestore.FieldValue.increment(-deductAmount) });
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear();
          const yearTH = year + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${yearTH} ${hours}:${mins} น.`;
          const dateISO = `${year}-${month}-${day}`;

          const logRef = db.collection('logs').doc();
          const newLogId = logRef.id;

          const titleText = order.items.map(i => `${i.menuName} (${i.qty} แก้ว)`).join(', ');
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'สั่งปรุง/ขาย',
            title: `ออเดอร์ลูกค้าสแกน: ${titleText}`,
            details: Object.entries(deductionsSummary).map(([sId, amt]) => {
              const s = stocks.find(item => item.id === sId);
              return `${s ? s.name : 'วัตถุดิบ'}: -${amt.toFixed(2)} ${s ? s.unit : ''}`;
            }),
            rawDeductions: deductionsSummary,
            totalAmount: order.totalPrice,
            note: order.note || 'ลูกค้าสแกนสั่ง'
          });

          // บันทึกลง Sales
          order.items.forEach(item => {
            const saleRef = db.collection('sales').doc();
            batch.set(saleRef, {
              logId: newLogId,
              recipeId: item.recipeId || '',
              menuName: item.menuName,
              cups: Number(item.qty),
              pricePerCup: Number(item.price),
              totalAmount: Number(item.totalPrice),
              note: order.note || '',
              datetime: timeStr,
              dateISO: dateISO,
              monthKey: `${year}-${month}`,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          });

          // อัปเดตสถานะออเดอร์เป็น completed
          const orderRef = db.collection('orders').doc(order.id);
          batch.update(orderRef, { status: 'completed' });

          await batch.commit();
          alert(`✅ ยืนยันรับออเดอร์ คิดเงิน (${order.totalPrice} ฿) และตัดสต๊อกเรียบร้อย!`);
        } catch (err) {
          console.error(err);
          alert('เกิดข้อผิดพลาดในการรับออเดอร์');
        }
      };

      // ยกเลิกออเดอร์ลูกค้า
      const handleCancelCustomerOrder = async (orderId) => {
        if (confirm('คุณต้องการยกเลิกออเดอร์นี้ใช่หรือไม่?')) {
          await db.collection('orders').doc(orderId).update({ status: 'cancelled' });
        }
      };

      const handleDeleteSale = async (id) => {
        if (confirm('คุณต้องการลบรายการขายนี้ใช่หรือไม่?')) {
          await db.collection('sales').doc(id).delete();
        }
      };

      const todayISO = useMemo(() => {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
      }, []);

      const selectedDailySalesSummary = useMemo(() => {
        const targetLogs = salesLogs.filter(s => s.dateISO === selectedDailyDate);
        const totalMoney = targetLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        const totalCups = targetLogs.reduce((acc, curr) => acc + (curr.cups || 0), 0);
        return { totalMoney, totalCups, count: targetLogs.length, logs: targetLogs };
      }, [salesLogs, selectedDailyDate]);

      const todaySalesSummary = useMemo(() => {
        const todayLogs = salesLogs.filter(s => s.dateISO === todayISO);
        const totalMoney = todayLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        return { totalMoney };
      }, [salesLogs, todayISO]);

      const monthSalesSummary = useMemo(() => {
        const monthLogs = salesLogs.filter(s => s.monthKey === selectedMonth);
        const totalMoney = monthLogs.reduce((acc, curr) => acc + (curr.totalAmount || 0), 0);
        const totalCups = monthLogs.reduce((acc, curr) => acc + (curr.cups || 0), 0);
        const uniqueDays = new Set(monthLogs.map(s => s.dateISO)).size;
        const avgDailyMoney = uniqueDays > 0 ? Math.round(totalMoney / uniqueDays) : 0;
        return { totalMoney, totalCups, count: monthLogs.length, uniqueDays, avgDailyMoney, monthLogs };
      }, [salesLogs, selectedMonth]);

      const handleConfirmDeleteLog = async (shouldRestore) => {
        if (!logToDelete) return;
        try {
          const batch = db.batch();
          if (shouldRestore && logToDelete.rawDeductions) {
            Object.entries(logToDelete.rawDeductions).forEach(([sId, amount]) => {
              const stockRef = db.collection('stocks').doc(sId);
              batch.update(stockRef, { current: firebase.firestore.FieldValue.increment(Number(amount)) });
            });
          }
          const relatedSales = salesLogs.filter(s => s.logId === logToDelete.id);
          relatedSales.forEach(s => {
            const saleRef = db.collection('sales').doc(s.id);
            batch.delete(saleRef);
          });
          const logRef = db.collection('logs').doc(logToDelete.id);
          batch.delete(logRef);

          await batch.commit();
          alert('ลบประวัติพร้อมปรับลบยอดขายและสต๊อกเรียบร้อยแล้ว!');
          setLogToDelete(null);
        } catch (e) {
          console.error(e); alert('เกิดข้อผิดพลาดในการลบ');
        }
      };

      const lowStockItems = useMemo(() => {
        return stocks.filter(item => Number(item.current || 0) <= Number(item.minAlert || 0));
      }, [stocks]);

      const filteredProductionRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchProduction.toLowerCase()));
      }, [recipes, searchProduction]);

      const filteredStocks = useMemo(() => {
        return stocks.filter(s => {
          const matchSearch = s.name.toLowerCase().includes(searchStock.toLowerCase());
          const matchCategory = selectedCategory === 'all' || s.category === selectedCategory;
          return matchSearch && matchCategory;
        });
      }, [stocks, searchStock, selectedCategory]);

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchRecipe.toLowerCase()));
      }, [recipes, searchRecipe]);

      const filteredLogs = useMemo(() => {
        return logs.filter(l => 
          (l.title && l.title.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.note && l.note.toLowerCase().includes(searchHistory.toLowerCase()))
        );
      }, [logs, searchHistory]);

      const handleImageUpload = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => callback(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleQuantityChange = (recipeId, delta) => {
        setBatchQuantities(prev => {
          const current = prev[recipeId] || 0;
          return { ...prev, [recipeId]: Math.max(0, current + delta) };
        });
      };

      const selectedProductionList = useMemo(() => {
        return Object.entries(batchQuantities)
          .filter(([_, qty]) => qty > 0)
          .map(([recipeId, qty]) => {
            const recipe = recipes.find(r => r.id === recipeId);
            const unitPrice = recipe ? (recipe.price || 35) : 35;
            return {
              recipeId, name: recipe ? recipe.name : 'เครื่องดื่ม', qty, price: unitPrice, totalPrice: unitPrice * qty, recipe
            };
          });
      }, [batchQuantities, recipes]);

      const grandTotalPrice = useMemo(() => {
        return selectedProductionList.reduce((acc, curr) => acc + curr.totalPrice, 0);
      }, [selectedProductionList]);

      const handleConfirmProductionAndCheckout = async () => {
        if (selectedProductionList.length === 0) return alert('กรุณาเลือกรายการอย่างน้อย 1 รายการ');

        try {
          const batch = db.batch();
          const deductionsSummary = {};

          selectedProductionList.forEach(item => {
            if (item.recipe && item.recipe.ingredients) {
              item.recipe.ingredients.forEach(ing => {
                const stockItem = stocks.find(s => s.id === ing.stockId);
                if (stockItem) {
                  const rawAmount = Number(ing.amount) * item.qty;
                  const convertedAmount = convertUnitToStock(rawAmount, ing.unit, stockItem.unit);
                  deductionsSummary[ing.stockId] = (deductionsSummary[ing.stockId] || 0) + convertedAmount;
                }
              });
            }
          });

          Object.entries(deductionsSummary).forEach(([stockId, deductAmount]) => {
            const stockRef = db.collection('stocks').doc(stockId);
            batch.update(stockRef, { current: firebase.firestore.FieldValue.increment(-deductAmount) });
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear();
          const yearTH = year + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${yearTH} ${hours}:${mins} น.`;
          const dateISO = `${year}-${month}-${day}`;

          const logRef = db.collection('logs').doc();
          const newLogId = logRef.id;

          const titleText = selectedProductionList.map(item => `${item.name} (${item.qty} แก้ว)`).join(', ');
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'สั่งปรุง/ขาย',
            title: `สั่งปรุง/ขายหน้าร้าน: ${titleText}`,
            details: Object.entries(deductionsSummary).map(([sId, amt]) => {
              const s = stocks.find(item => item.id === sId);
              return `${s ? s.name : 'วัตถุดิบ'}: -${amt.toFixed(2)} ${s ? s.unit : ''}`;
            }),
            rawDeductions: deductionsSummary,
            totalAmount: grandTotalPrice,
            note: productionNote || 'สั่งปรุงหน้าร้าน'
          });

          selectedProductionList.forEach(item => {
            const saleRef = db.collection('sales').doc();
            batch.set(saleRef, {
              logId: newLogId,
              recipeId: item.recipeId,
              menuName: item.name,
              cups: Number(item.qty),
              pricePerCup: Number(item.price),
              totalAmount: Number(item.totalPrice),
              note: productionNote || '',
              datetime: timeStr,
              dateISO: dateISO,
              monthKey: `${year}-${month}`,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          });

          await batch.commit();
          alert(`✅ บันทึกสั่งปรุง คิดเงิน (${grandTotalPrice} ฿) เรียบร้อย!`);
          setBatchQuantities({}); setProductionNote('');
        } catch (error) {
          console.error(error); alert("เกิดข้อผิดพลาดในการบันทึก");
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <header className="bg-white border-b border-amber-200/60 sticky top-0 z-40 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center space-x-2.5">
                  <div className="bg-amber-800 text-amber-100 p-2 rounded-2xl shadow-md">
                    <i data-lucide="cup-soda" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-amber-950 text-base sm:text-lg leading-none">ชานมกลมกล่อม</h1>
                    <p className="text-[10px] text-amber-800/70 font-semibold mt-0.5">ระบบจัดการหลังร้าน & สต๊อก</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <button onClick={() => setActiveTab('salesSummary')} className="bg-amber-800 text-amber-50 text-xs font-bold px-3 py-2 rounded-xl shadow-md">
                    <span>ยอดขายวันนี้: {todaySalesSummary.totalMoney.toLocaleString()} ฿</span>
                  </button>
                  <button onClick={() => setPrintModalOpen(true)} className="bg-stone-800 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-md">
                    <i data-lucide="printer" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div className="bg-amber-100/40 p-1.5 border-t border-amber-200/50">
                <div className="max-w-7xl mx-auto flex space-x-1 overflow-x-auto no-scrollbar justify-start sm:justify-center px-2">
                  <button onClick={() => handleTabChange('ordersTab')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap relative ${activeTab === 'ordersTab' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>📥 ออเดอร์ลูกค้าสแกน</span>
                    {pendingOrders.length > 0 && <span className="ml-1.5 bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold animate-pulse">{pendingOrders.length}</span>}
                  </button>
                  <button onClick={() => handleTabChange('production')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'production' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>🧋 สั่งปรุงหน้าร้าน</span>
                  </button>
                  <button onClick={() => handleTabChange('salesSummary')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'salesSummary' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>📊 สรุปยอดขาย</span>
                  </button>
                  <button onClick={() => handleTabChange('stock')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'stock' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>📦 คลังวัตถุดิบ</span>
                  </button>
                  <button onClick={() => handleTabChange('bom')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'bom' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>📖 สูตร BOM</span>
                  </button>
                  <button onClick={() => handleTabChange('history')} className={`px-3.5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'history' ? 'bg-amber-800 text-white' : 'text-stone-600'}`}>
                    <span>📜 ประวัติขาย</span>
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 my-4 sm:my-6">
              {loading ? (
                <div className="text-center py-20 text-amber-900 font-medium text-sm">กำลังโหลดข้อมูลระบบ...</div>
              ) : (
                <>
                  {/* TAB 0: ออเดอร์เด้งเข้า Real-time จากลูกค้า */}
                  {activeTab === 'ordersTab' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="mb-6 pb-4 border-b border-stone-100 flex justify-between items-center">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                            <span>📥</span> รายการออเดอร์เข้าใหม่ (ลูกค้าสแกนสั่ง)
                          </h2>
                          <p className="text-xs text-stone-400 mt-1">ออเดอร์จะเด้งขึ้นมาตรงนี้อัตโนมัติเมื่อลูกค้ากดสั่งผ่าน QR Code</p>
                        </div>
                        <span className="bg-amber-100 text-amber-900 font-extrabold text-xs px-3 py-1.5 rounded-xl">
                          ค้างรับ {pendingOrders.length} ออเดอร์
                        </span>
                      </div>

                      {pendingOrders.length === 0 ? (
                        <div className="text-center py-16 text-stone-400 text-xs sm:text-sm">
                          ยังไม่มีออเดอร์ใหม่เข้ามาขณะนี้
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {pendingOrders.map(order => (
                            <div key={order.id} className="bg-amber-50/50 border-2 border-amber-300 rounded-3xl p-5 shadow-sm space-y-3 relative flex flex-col justify-between">
                              <div>
                                <div className="flex justify-between items-center border-b border-amber-200 pb-2.5">
                                  <span className="text-xs text-stone-400 font-medium">{order.datetime}</span>
                                  <span className="bg-amber-200 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded-md">รอรับออเดอร์</span>
                                </div>

                                <div className="space-y-1.5 my-3">
                                  {order.items && order.items.map((item, idx) => (
                                    <div key={idx} className="flex justify-between text-xs sm:text-sm font-bold text-amber-950 bg-white p-2.5 rounded-xl border border-amber-100">
                                      <span>{item.menuName} × {item.qty}</span>
                                      <span className="text-amber-800">{item.totalPrice} ฿</span>
                                    </div>
                                  ))}
                                </div>

                                {order.note && (
                                  <div className="text-xs text-stone-600 bg-amber-100/60 p-2.5 rounded-xl border border-amber-200/50 italic">
                                    หมายเหตุ: {order.note}
                                  </div>
                                )}
                              </div>

                              <div className="pt-3 border-t border-amber-200 space-y-2">
                                <div className="flex justify-between items-center font-black text-amber-950 text-base">
                                  <span>ยอดรวม:</span>
                                  <span className="text-amber-900">{order.totalPrice} บาท</span>
                                </div>
                                <div className="flex gap-2">
                                  <button
                                    onClick={() => handleCancelCustomerOrder(order.id)}
                                    className="flex-1 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs rounded-xl transition"
                                  >
                                    ✕ ยกเลิก
                                  </button>
                                  <button
                                    onClick={() => handleAcceptCustomerOrder(order)}
                                    className="flex-2 py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-bold text-xs rounded-xl shadow-md transition"
                                  >
                                    ✓ รับออเดอร์/คิดเงิน (ตัดสต๊อก)
                                  </button>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 1: สั่งปรุงหน้าร้าน */}
                  {activeTab === 'production' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      <div className="lg:col-span-7 bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                        <div className="mb-4 sm:mb-6">
                          <h2 className="text-lg sm:text-xl font-bold text-amber-950 flex items-center gap-2">
                            <span>🧋</span> สั่งปรุง & คิดเงินหน้าร้าน
                          </h2>
                          <p className="text-xs text-stone-400 mt-1">เลือกเมนูและจำนวนเพื่อคิดเงินและตัดสต๊อกหน้าร้าน</p>
                        </div>

                        <div className="mb-4 relative">
                          <input
                            type="text" placeholder="ค้นหาเมนู..." value={searchProduction} onChange={(e) => setSearchProduction(e.target.value)} className="w-full px-4 py-3 text-xs sm:text-sm rounded-xl custom-input pl-10"
                          />
                          <span className="absolute left-3.5 top-3.5 text-stone-400 text-xs">🔍</span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                          {filteredProductionRecipes.map(recipe => {
                            const qty = batchQuantities[recipe.id] || 0;
                            const price = recipe.price || 35;
                            return (
                              <div key={recipe.id} className="border-2 rounded-2xl p-3.5 border-amber-100 bg-white flex flex-col justify-between">
                                <div className="flex items-center space-x-3 mb-3">
                                  <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-2xl object-cover border" alt={recipe.name} />
                                  <div>
                                    <h3 className="font-bold text-amber-950 text-sm">{recipe.name}</h3>
                                    <span className="text-xs font-black text-amber-800 bg-amber-100 px-2 py-0.5 rounded-lg">{price} ฿</span>
                                  </div>
                                </div>
                                <div className="bg-stone-50 border rounded-xl p-1 flex items-center justify-between">
                                  <button onClick={() => handleQuantityChange(recipe.id, -1)} disabled={qty === 0} className="w-8 h-8 rounded-lg font-bold text-stone-700 bg-white border">-</button>
                                  <span className="font-bold text-sm text-amber-950">{qty}</span>
                                  <button onClick={() => handleQuantityChange(recipe.id, 1)} className="w-8 h-8 rounded-lg bg-amber-800 text-white font-bold">+</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        <input type="text" placeholder="หมายเหตุ / ชื่อผู้สั่ง..." value={productionNote} onChange={(e) => setProductionNote(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                      </div>

                      <div className="lg:col-span-5">
                        <div className="bg-[#2b1e16] text-white rounded-3xl p-5 sm:p-8 shadow-2xl sticky top-28">
                          <h2 className="font-bold text-base sm:text-lg text-amber-100 mb-4">สรุปรายการคิดเงินหน้าร้าน</h2>
                          <div className="bg-[#3d2b1f] rounded-2xl p-3.5 mb-3 flex justify-between items-center text-xs">
                            <span className="text-amber-200">ยอดรวมชำระเงิน:</span>
                            <span className="text-xl font-black text-amber-400">{grandTotalPrice.toLocaleString()} บาท</span>
                          </div>

                          <div className="space-y-2 max-h-[250px] overflow-y-auto pr-1">
                            {selectedProductionList.map(item => (
                              <div key={item.recipeId} className="bg-[#3d2b1f] p-3 rounded-2xl flex justify-between items-center text-xs">
                                <div>
                                  <div className="font-bold text-amber-100">{item.name}</div>
                                  <div className="text-[10px] text-amber-300">{item.price} ฿ × {item.qty} = {item.totalPrice} ฿</div>
                                </div>
                                <div className="flex items-center space-x-1">
                                  <button onClick={() => handleQuantityChange(item.recipeId, -1)} className="w-6 h-6 bg-stone-800 rounded">-</button>
                                  <span className="px-2 font-bold text-amber-400">{item.qty}</span>
                                  <button onClick={() => handleQuantityChange(item.recipeId, 1)} className="w-6 h-6 bg-amber-700 rounded">+</button>
                                </div>
                              </div>
                            ))}
                          </div>

                          <button onClick={handleConfirmProductionAndCheckout} disabled={selectedProductionList.length === 0} className="w-full mt-5 py-4 bg-amber-500 text-amber-950 font-bold text-sm sm:text-base rounded-2xl shadow-lg">
                            ยืนยันสั่งปรุง & คิดเงิน ({grandTotalPrice} ฿)
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: สรุปยอดขาย (ดูย้อนหลังได้) */}
                  {activeTab === 'salesSummary' && (
                    <div className="space-y-6">
                      <div className="bg-white rounded-3xl p-5 sm:p-8 border border-amber-200/60 custom-shadow">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 pb-4 border-b border-stone-100 mb-4">
                          <div>
                            <h2 className="text-lg font-bold text-amber-950 flex items-center gap-2">
                              <span>📅</span> สรุปยอดขายรายวัน (เลือกดูย้อนหลัง)
                            </h2>
                          </div>
                          <input type="date" value={selectedDailyDate} onChange={(e) => setSelectedDailyDate(e.target.value)} className="px-3.5 py-2 text-xs sm:text-sm rounded-xl custom-input font-bold" />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                          <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-amber-800 block">ยอดขายรวมประจำวัน</span>
                            <span className="text-2xl font-black text-amber-700 mt-1 block">{selectedDailySalesSummary.totalMoney.toLocaleString()} บาท</span>
                          </div>
                          <div className="bg-orange-50 border border-orange-200 rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-orange-800 block">จำนวนแก้วที่ขายได้</span>
                            <span className="text-2xl font-black text-orange-700 mt-1 block">{selectedDailySalesSummary.totalCups.toLocaleString()} แก้ว</span>
                          </div>
                          <div className="bg-stone-50 border rounded-2xl p-4 text-center">
                            <span className="text-xs font-bold text-stone-700 block">จำนวนออเดอร์</span>
                            <span className="text-2xl font-black text-stone-800 mt-1 block">{selectedDailySalesSummary.count} รายการ</span>
                          </div>
                        </div>

                        <div className="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                          {selectedDailySalesSummary.logs.map(log => (
                            <div key={log.id} className="bg-stone-50 border p-3 rounded-2xl flex justify-between items-center text-xs">
                              <div>
                                <span className="font-bold text-amber-950 text-sm block">{log.menuName}</span>
                                <span className="text-stone-400 text-[11px]">{log.datetime} {log.note ? `• ${log.note}` : ''}</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <span className="font-black text-amber-800 text-sm">+{log.totalAmount} ฿</span>
                                <button onClick={() => handleDeleteSale(log.id)} className="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: คลังวัตถุดิบ */}
                  {activeTab === 'stock' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="flex justify-between items-center mb-4 pb-4 border-b">
                        <h2 className="text-lg font-bold text-amber-950">📦 คลังวัตถุดิบคงเหลือ</h2>
                        <div className="flex gap-2">
                          <button onClick={() => setRestockModalOpen(true)} className="btn-pill btn-boba text-xs px-3.5 py-2">+ เติมสต๊อก</button>
                          <button onClick={() => { setEditingStock(null); setStockModalOpen(true); }} className="btn-pill btn-dark-boba text-xs px-3.5 py-2">+ เพิ่มวัตถุดิบ</button>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                        {filteredStocks.map(s => (
                          <div key={s.id} className="p-3 rounded-2xl border bg-white flex flex-col justify-between">
                            <div className="flex items-center space-x-2 mb-2">
                              <img src={s.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-xl object-cover border" alt={s.name} />
                              <span className="font-bold text-xs text-amber-950 truncate">{s.name}</span>
                            </div>
                            <div className="bg-stone-50 p-2 rounded-xl text-center font-black text-base text-amber-950 mb-2">
                              {s.current} <span className="text-[10px] font-normal text-stone-400">{s.unit}</span>
                            </div>
                            <div className="flex justify-end gap-1">
                              <button onClick={() => { setEditingStock(s); setStockModalOpen(true); }} className="p-1 text-stone-400 hover:text-amber-800"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 4: สูตร BOM */}
                  {activeTab === 'bom' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <div className="flex justify-between items-center mb-6 pb-4 border-b">
                        <h2 className="text-lg font-bold text-amber-950">📖 จัดการสูตรการผลิต (BOM)</h2>
                        <button onClick={() => { setEditingRecipe(null); setRecipeModalOpen(true); }} className="btn-pill btn-dark-boba text-xs px-4 py-2.5">+ เพิ่มสูตรใหม่</button>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredRecipes.map(recipe => (
                          <div key={recipe.id} className="bg-amber-50/30 border border-amber-200/60 rounded-2xl p-4">
                            <div className="flex justify-between items-center border-b pb-3 mb-3">
                              <div className="flex items-center space-x-3">
                                <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border" alt={recipe.name} />
                                <div>
                                  <h3 className="font-bold text-amber-950 text-sm">{recipe.name}</h3>
                                  <span className="text-xs font-black text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">ราคา {recipe.price || 35} ฿</span>
                                </div>
                              </div>
                              <div className="flex space-x-1">
                                <button onClick={() => { setEditingRecipe(recipe); setRecipeModalOpen(true); }} className="p-1.5 text-stone-400 hover:text-amber-800"><i data-lucide="edit-3" className="w-4 h-4"></i></button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 5: ประวัติขาย */}
                  {activeTab === 'history' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-amber-200/60 custom-shadow">
                      <h2 className="text-lg font-bold text-amber-950 mb-4 pb-4 border-b">📜 ประวัติสั่งปรุง/ขาย</h2>
                      <div className="space-y-3">
                        {filteredLogs.map(log => (
                          <div key={log.id} className="bg-amber-50/30 border border-amber-200/50 p-4 rounded-2xl flex justify-between items-center text-xs">
                            <div>
                              <span className="bg-amber-800 text-amber-100 text-[10px] font-bold px-2 py-0.5 rounded-md">{log.datetime}</span>
                              <h3 className="font-bold text-sm text-amber-950 mt-1">{log.title}</h3>
                              {log.totalAmount && <p className="text-xs font-bold text-amber-700">ยอดเงิน: {log.totalAmount} บาท</p>}
                            </div>
                            <button onClick={() => setLogToDelete(log)} className="text-rose-600 bg-rose-50 border border-rose-200 font-bold px-3 py-1.5 rounded-xl"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i> ลบ</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          <footer className="bg-white border-t border-amber-200/60 py-4 text-center text-xs text-amber-900/50 mt-8">
            <p>© {new Date().getFullYear()} ระบบสต๊อก & หลังร้าน - ชานมกลมกล่อม</p>
          </footer>

          <CategoryModal isOpen={categoryModalOpen} onClose={() => setCategoryModalOpen(false)} categories={categories} onAddCategory={(cat) => db.collection('categories').add({ name: cat })} onDeleteCategory={(id) => db.collection('categories').doc(id).delete()} />
          <StockSummaryByCategoryModal isOpen={stockCategorySummaryModalOpen} onClose={() => setStockCategorySummaryModalOpen(false)} stocks={stocks} categories={categories} />
          <StockModal isOpen={stockModalOpen} onClose={() => setStockModalOpen(false)} onSave={async (data) => { if (data.id) { const id = data.id; delete data.id; await db.collection('stocks').doc(id).update(data); } else { delete data.id; await db.collection('stocks').add(data); } setStockModalOpen(false); }} editingStock={editingStock} handleImageUpload={handleImageUpload} categories={categories} onOpenCategoryModal={() => { setStockModalOpen(false); setCategoryModalOpen(true); }} />
          <RestockModal isOpen={restockModalOpen} onClose={() => setRestockModalOpen(false)} stocks={stocks} categories={categories} onConfirmBatchRestock={async (map, note) => { const batch = db.batch(); Object.entries(map).forEach(([sId, qty]) => { if (Number(qty) > 0) { batch.update(db.collection('stocks').doc(sId), { current: firebase.firestore.FieldValue.increment(Number(qty)) }); } }); await batch.commit(); setRestockModalOpen(false); }} />
          <RecipeModal isOpen={recipeModalOpen} onClose={() => setRecipeModalOpen(false)} onSave={async (data) => { if (data.id) { const id = data.id; delete data.id; await db.collection('recipes').doc(id).update(data); } else { delete data.id; await db.collection('recipes').add(data); } setRecipeModalOpen(false); }} editingRecipe={editingRecipe} stocks={stocks} handleImageUpload={handleImageUpload} />
          <DeleteLogModal isOpen={!!logToDelete} onClose={() => setLogToDelete(null)} logToDelete={logToDelete} onConfirmDelete={handleConfirmDeleteLog} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
